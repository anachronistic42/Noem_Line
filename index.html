<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noem.pipeline</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--panel:#fbf8f1;--ink:#1d2330;--mute:#7a7f8c;--line:#ded8c8;--acc:#1f4fd8;--accT:#fff;
--s0:#9aa0ac;--s1:#1f4fd8;--s2:#b7791f;--s3:#c8452d;--s4:#2c8a57;--s5:#7c4dbb;--s6:#1b8a94;--s7:#3b4252;--s8:#a3123a;--bubble:#ece6d6;--mine:#dfe8ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1118;--panel:#171b25;--ink:#e8eaf0;--mute:#8b91a0;--line:#262c3a;--acc:#6b8cff;--accT:#0e1118;
--s0:#6d7482;--s1:#6b8cff;--s2:#e0a640;--s3:#f0735a;--s4:#4fc88a;--s5:#b48cf0;--s6:#4fc9d4;--s7:#c9cedb;--s8:#ff5c8a;--bubble:#202635;--mine:#22346b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1118;--panel:#171b25;--ink:#e8eaf0;--mute:#8b91a0;--line:#262c3a;--acc:#6b8cff;--accT:#0e1118;--s0:#6d7482;--s1:#6b8cff;--s2:#e0a640;--s3:#f0735a;--s4:#4fc88a;--s5:#b48cf0;--s6:#4fc9d4;--s7:#c9cedb;--s8:#ff5c8a;--bubble:#202635;--mine:#22346b}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Golos Text",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:default}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font:600 15px "Unbounded",sans-serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex:none}
.btn{background:var(--acc);color:var(--accT);padding:8px 14px;border-radius:10px;font-weight:500}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 13px;font-size:13px;flex:none;white-space:nowrap}
#bell{position:relative}
.bdg{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--s3);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;pointer-events:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;font-weight:500;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;line-height:1.2}
.tile .ic{font-size:22px}.tile.off{opacity:.55}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel)}
nav button{flex:1;padding:12px;color:var(--mute);font-weight:500}
nav button.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.wrap{padding:12px 14px;max-width:720px;margin:0 auto}
.card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center;width:100%;text-align:left}
.num{font:600 13px "Unbounded",sans-serif;min-width:34px;color:var(--mute)}
.th{width:84px;height:52px;border-radius:8px;background:var(--bubble) center/cover;flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c,var(--s1))}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--c);border:1px solid var(--c);border-radius:20px;padding:1px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pct{font:500 12px "Unbounded",sans-serif;color:var(--mute)}
.ava{width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--accT);font-size:11px;font-weight:600;display:grid;place-items:center;margin-left:-6px;border:2px solid var(--panel)}
.avas{display:flex;padding-left:6px}
.h2{font:600 13px "Unbounded",sans-serif;margin:16px 0 8px}
.empty{text-align:center;color:var(--mute);padding:48px 20px}
.empty .btn{margin-top:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:13px}
.seg button.on{border-color:var(--c,var(--acc));color:var(--c,var(--acc));font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc)}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;margin:6px 0;background:var(--bubble);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{margin-left:auto;background:var(--mine)}
.msg .who{font-size:12px;color:var(--mute);margin-bottom:2px;white-space:normal}
.msg img{display:block;max-width:100%;max-height:340px;border-radius:8px;margin:4px 0;cursor:zoom-in;background:var(--line);min-height:60px;min-width:120px}
.file{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:4px 0;white-space:normal}
.file .fn{font-weight:500;overflow-wrap:anywhere}
.msg.sel{outline:2px solid var(--acc);outline-offset:1px}
.msg[data-mid]{-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){.msg[data-mid]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}}
#hd .sub{-webkit-line-clamp:unset;display:block;overflow:visible;overflow-wrap:anywhere;white-space:pre-wrap}
#hd .grow{min-width:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;white-space:normal;margin-top:4px}
.acts button{font-size:12px;border:1px solid var(--line);border-radius:14px;padding:2px 9px;color:var(--acc)}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-right:6px;color:var(--accT);background:var(--s1)}
.tag.fix{background:var(--s3)}.tag.done{background:var(--s4)}
.comp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel);align-items:flex-end}
.comp textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);resize:none;max-height:40vh;overflow-y:auto;line-height:1.35}
#hd .th{cursor:zoom-in}
body.dz::after{content:"Отпустите файл, чтобы прикрепить";position:fixed;inset:8px;border:2px dashed var(--acc);border-radius:16px;background:#0008;color:#fff;display:grid;place-items:center;font-size:16px;z-index:25;pointer-events:none}
.mode{font-size:12px;color:var(--mute);padding:6px 14px 0;background:var(--panel);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode button{color:var(--acc);font-size:12px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--panel);width:100%;max-width:520px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.lb{position:fixed;inset:0;background:#000d;z-index:30;display:grid;place-items:center}.lb img{max-width:96%;max-height:92%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:40;font-size:13px;max-width:90%;text-align:center}
.big{font:600 28px "Unbounded",sans-serif}
.note{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px;white-space:normal}
.link{user-select:all;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
</style>
</head>
<body>
<header><button class="ib" id="back" hidden>‹</button><h1 id="ttl">Noem.pipeline</h1><button class="ib" id="hx" hidden title="Снять выбор"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button><button class="ib" id="hpin" hidden title="Закрепить / открепить"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg></button><button class="ib" id="hdel" hidden title="Удалить"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button><button class="ib" id="bell" hidden title="Уведомления"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="bdg" id="bdg" hidden></span></button><button class="ib" id="cfg" hidden title="Настройки"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></header>
<main id="main"></main>
<div id="foot"></div>
<nav id="nav"><button data-r="scenes">Сцены</button><button data-r="team">Команда</button></nav>
<input type="file" id="file" accept=".noemocean,.noem.ocean,.noemotion,application/json" hidden>
<input type="file" id="pic" hidden>
<input type="file" id="pdf" accept="application/pdf,.pdf" hidden>
<script>
/* ===== НАСТРОЙКА: адрес вашей функции в Supabase ===== */
const API = "https://admbsxycsucognmoxmng.supabase.co/functions/v1/noem";
/* ===================================================== */

const TGW = window.Telegram && Telegram.WebApp;
const INIT = (TGW && TGW.initData) || "";
if (TGW) { try { TGW.ready(); TGW.expand(); if (TGW.colorScheme) document.documentElement.dataset.theme = TGW.colorScheme; } catch (e) {} }
const BOT_NAME="Noem_Line_bot";let WEB="";try{WEB=localStorage.getItem("noem_web")||""}catch(e){}
const AH=()=>INIT?{"x-init-data":INIT}:{"x-web-token":WEB};
const NATIVE_BACK = !!(TGW && TGW.BackButton && TGW.isVersionAtLeast && TGW.isVersionAtLeast("6.1"));

const ST = [["todo","Не начат","--s0"],["work","В работе","--s1"],["review","На проверке","--s2"],["fix","Правки","--s3"],["done","Принят","--s4"],["ship","Отгрузить","--s5"],["shipped","Отгружен","--s6"],["finished","Завершён","--s7"],["error","Ошибка","--s8"]];
const ACCEPTED=["done","ship","shipped","finished"];
const PERM_L=[["assign","Назначать и снимать с задачи"],["fix","Выдавать правки"],["status","Менять любые статусы"],["invite","Приглашать в группу"],["del_any","Удалять любые сообщения"],["pin_any","Закреплять любые сообщения"]];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S = { stages:[], ss:{}, stage:null, roles:[], showAll:false, me:null, scenes:[], shots:[], members:[], project:null, chat:null, bound:false, thumbs:{}, msgs:[],
  unread:0, sinceShots:0, sinceMsgs:0, curShot:null, pendingFile:null, asFile:false, fixMode:false, busy:false };
const stOf = k => ST.find(s => s[0] === k) || ST[0];
const fmtSize = n => !n ? "" : n < 1048576 ? Math.round(n/1024) + " КБ" : (n/1048576).toFixed(n < 10485760 ? 1 : 0) + " МБ";
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}

/* ---------- сеть ---------- */
async function call(action, data){
  const r = await fetch(API, {method:"POST", headers:{"content-type":"application/json",...AH()}, body:JSON.stringify({action, ...data})});
  return handle(r);
}
async function handle(r){
  if(!r.ok){let e={};try{e=await r.json()}catch(x){}const er=new Error(e.error||("HTTP "+r.status));er.code=e.error;er.status=r.status;throw er}
  return r.json();
}
const ERR = {pdf_big:"PDF больше 20 МБ: Telegram не даёт приложению скачивать такие файлы", not_pdf:"Нужен файл в формате PDF", bad_url:"Ссылка должна начинаться с http:// или https://", too_big:"Файл больше 50 МБ. Отправьте его прямо в топик в Telegram.", forbidden:"Нет прав на это действие", start_bot:"Сначала нажмите Start в чате с ботом", empty:"Пустое сообщение"};
const errText = e => ERR[e.code] || e.message || "Ошибка";
const blobCache = new Map();
function fileBlob(id){
  if(!blobCache.has(id)){
    blobCache.set(id, fetch(API,{method:"POST",headers:{"content-type":"application/json",...AH()},body:JSON.stringify({action:"file",file_id:id})})
      .then(async r=>{if(!r.ok){const e=await r.json().catch(()=>({}));const er=new Error(e.error||"HTTP "+r.status);er.code=e.error;throw er}return URL.createObjectURL(await r.blob())})
      .catch(e=>{blobCache.delete(id);throw e}));
  }
  return blobCache.get(id);
}

/* ---------- данные ---------- */
const shotsOf = id => vis().filter(h => h.scene === id);
const mm = id => S.members.find(m => m.tg_id === id);
const nm = id => (mm(id) && mm(id).name) || "Участник";
const ini = id => (nm(id)[0] || "?").toUpperCase();
const has=p=>S.me.owner||(S.me.perms||[]).includes(p);
const seeAll=()=>S.me.owner||S.me.role==="Продюсер"||S.showAll;
const mine=h=>(h.assignees||[]).includes(S.me.id);
const vis=()=>seeAll()?S.shots:S.shots.filter(mine);
const canEdit=h=>S.me.owner||mine(h)||has("status");
const fixStage=()=>{if(!S.stages.some(s=>s.id===S.stage))S.stage=S.stages[0]?S.stages[0].id:null};
const stOfShot=h=>S.stage?(S.ss[S.stage]||(S.stage===h.cur_stage?{status:h.status||"todo",progress:h.progress||0}:{status:"todo",progress:0})):{status:h.status||"todo",progress:h.progress||0};
const msgStage=x=>S.stages.some(s=>s.id===x.stage_id)?x.stage_id:(S.stages[0]?S.stages[0].id:null);
const showToggle=()=>S.me.owner||S.me.role==="Продюсер"?"":`<label class="note" style="display:block"><input type="checkbox" data-showall ${S.showAll?"checked":""}> Показать задачи, на которые вы не назначены</label>`;
function sceneAgg(id){const a=shotsOf(id);if(!a.length)return{pct:0,st:"todo",n:0};
 const pct=Math.round(a.reduce((s,h)=>s+(h.progress||0),0)/a.length),k=a.map(h=>h.status||"todo"),has=x=>k.includes(x);
 const st=k.every(x=>x===k[0])?k[0]:has("error")?"error":has("fix")?"fix":has("work")?"work":has("review")?"review":"work";
 return{pct,st,n:a.length}}
const maxU = (arr, cur) => arr.reduce((m, x) => Math.max(m, x.updated_at || 0), cur || 0);
function mergeShots(rows){for(const r of rows){const i=S.shots.findIndex(x=>x.id===r.id);if(i<0)S.shots.push(r);else S.shots[i]=r}
 S.shots.sort((a,b)=>a.ord-b.ord);S.sinceShots=maxU(rows,S.sinceShots)}
function mergeMsgs(rows){for(const r of rows){const i=S.msgs.findIndex(x=>x.id===r.id);if(i<0)S.msgs.push(r);else S.msgs[i]=r}
 S.msgs.sort((a,b)=>a.id-b.id);S.sinceMsgs=maxU(rows,S.sinceMsgs)}
async function ensureThumbs(ids){const need=ids.filter(i=>!(i in S.thumbs));if(!need.length)return;need.forEach(i=>S.thumbs[i]="");
 try{for(let i=0;i<need.length;i+=100){const r=await call("thumbs",{ids:need.slice(i,i+100)});Object.assign(S.thumbs,r)}}catch(e){}
 paintThumbs()}
function paintThumbs(){document.querySelectorAll("[data-th]").forEach(e=>{const t=S.thumbs[e.dataset.th];if(t)e.style.backgroundImage="url("+t+")"})}

/* ---------- импорт .noemocean ---------- */
function srcOf(r,i){i=i||0;try{const v=(r.sbVars||[])[i];const src=Array.isArray(v)?v[(r.sbSel||[])[i]||0]||v[0]:v;return typeof src==="string"&&src.startsWith("data:image")?src:""}catch(e){return""}}
function scaled(r,max,q,blob,ix){return new Promise(res=>{const src=srcOf(r,ix);if(!src)return res(blob?null:"");
 const im=new Image();im.onload=()=>{try{const W=im.naturalWidth||im.width,H=im.naturalHeight||im.height,k=Math.min(1,max/Math.max(W,H)),w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k)),c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(im,0,0,w,h);
  if(blob)c.toBlob(b=>res(b),"image/jpeg",q);else res(c.toDataURL("image/jpeg",q))}catch(e){res(blob?null:"")}};
 im.onerror=()=>res(blob?null:"");im.src=src})}
const thumbOf=r=>scaled(r,480,.8,false);
const fullOf=(r,ix)=>scaled(r,1600,.88,true,ix);
async function importFile(f){
 let d;try{d=JSON.parse(await f.text())}catch(e){return toast("Не удалось прочитать файл")}
 if(d.password){const p=await askText("Пароль проекта",true);if(p!==d.password)return toast("Неверный пароль")}
 if(!Array.isArray(d.dirRows))return toast("В файле нет раскадровки");
 const scenes=[],shots=[],rowOf={};let cur=null,ord=0,cnt=0;
 for(const r of d.dirRows){if(r.type==="note"||r.hidden)continue;
  if(r.type==="scene"){cur={id:"sc"+r.id,num:r.sceneNum||0,title:r.isCustomText?(r.customText||"Сцена"):[r.sceneIntExt,r.sceneLoc,r.sceneTime].filter(Boolean).join(" · "),info:r.sceneInfo||"",ord:ord++};scenes.push(cur)}
  else{if(!cur){cur={id:"sc0",num:0,title:"Без сцены",info:"",ord:ord++};scenes.push(cur)}cnt++;
   shots.push({id:"sh"+r.id,scene:cur.id,num:r.numDisplay||String(cnt).padStart(4,"0"),ord:ord++,action:r.action||"",sound:r.sound||"",notes:r.notes||"",scale:r.scale||"",montage:r.montage||"",tc:r.timecode||"",thumb:await thumbOf(r)});rowOf["sh"+r.id]=r}}
 if(!shots.length)return toast("В проекте нет кадров");
 const title=d.title||"Проект",CH=15;let done=0;const total=shots.length;
 const prog=()=>$("#ttl").textContent="Импорт "+Math.round(done/total*100)+"%";prog();
 try{

function askText(title,pass,def){return new Promise(res=>{const d=sheet(`<div class="h2" style="margin-top:0">${esc(title)}</div><input id="ai" value="${esc(def||"")}" ${pass?'type="password"':""} style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)"><div class="row" style="margin-top:12px"><button class="btn" id="aok">OK</button><button class="btn ghost" id="ano">Отмена</button></div>`);let done=false;const fin=v=>{if(done)return;done=true;d.remove();res(v)};
 d.querySelector("#aok").onclick=()=>fin(d.querySelector("#ai").value);d.querySelector("#ano").onclick=()=>fin(null);d.addEventListener("click",e=>{if(e.target===d)fin(null)});setTimeout(()=>d.querySelector("#ai").focus(),50)})}
function askYes(text){return new Promise(res=>{const d=sheet(`<p style="white-space:pre-wrap">${esc(text)}</p><div class="row" style="margin-top:12px"><button class="btn" id="y">Да</button><button class="btn ghost" id="n">Нет</button></div>`);let done=false;const fin=v=>{if(done)return;done=true;d.remove();res(v)};
 d.querySelector("#y").onclick=()=>fin(true);d.querySelector("#n").onclick=()=>fin(false);d.addEventListener("click",e=>{if(e.target===d)fin(false)})})}
function sheet(html){const d=document.createElement("div");d.className="sheet";d.innerHTML="<div>"+html+"</div>";d.onclick=e=>{if(e.target===d)d.remove()};document.body.append(d);return d}
function assignSheet(h){const mem=S.members;
 const d=sheet(`<div class="h2" style="margin-top:0">Назначить на кадр ${esc(h.num)}</div>${mem.length?mem.map(p=>`<label class="card" style="cursor:pointer"><input type="checkbox" value="${p.tg_id}" ${(h.assignees||[]).includes(p.tg_id)?"checked":""}><span class="grow"><div class="t">${esc(p.name)}</div><div class="sub">${esc(p.is_owner?"Режиссёр":(p.role||""))}</div></span></label>`).join(""):`<p class="sub">В команде пока никого. Пригласите людей в группу на вкладке «Команда».</p>`}<button class="btn" style="width:100%" id="ok">Готово</button>`);
 d.querySelector("#ok").onclick=()=>{const a=[...d.querySelectorAll("input:checked")].map(i=>+i.value);d.remove();setShot(h,{assignees:a})}}
function roleSheet(){const d=sheet(`<div class="h2" style="margin-top:0">Кто вы в проекте?</div><div class="seg">${S.roles.filter(r=>r.pickable).map(r=>`<button data-r="${esc(r.name)}">${esc(r.name)}</button>`).join("")}</div>`);
 d.onclick=async e=>{const r=e.target.dataset&&e.target.dataset.r;if(!r)return;d.remove();try{await call("set_role",{role:r});S.me.role=r;const p=mm(S.me.id);if(p)p.role=r;if(parse()[0]==="team")route()}catch(x){toast("Не удалось сохранить роль")}}}
async function inviteFlow(){const label=await askText("Для кого ссылка? (имя, чтобы потом не путаться)");if(label===null)return;
 try{const r=await call("invite",{label:label||"Участник"});
  const d=sheet(`<div class="h2" style="margin-top:0">Ссылка-приглашение</div><p class="sub" style="-webkit-line-clamp:unset">Одноразовая: сработает для одного человека.</p><div class="link">${esc(r.link)}</div><div class="row"><button class="btn" id="cp">Скопировать</button><button class="btn ghost" id="shr">Отправить в Telegram</button></div>`);
  d.querySelector("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(r.link);toast("Скопировано")}catch(e){toast("Выделите ссылку и скопируйте вручную")}};
  d.querySelector("#shr").onclick=()=>{const u="https://t.me/share/url?url="+encodeURIComponent(r.link);TGW&&TGW.openTelegramLink?TGW.openTelegramLink(u):open(u)}
 }catch(e){toast(errText(e))}}
const openTg=u=>TGW&&TGW.openTelegramLink?TGW.openTelegramLink(u):open(u);
const openLink=u=>TGW&&TGW.openLink?TGW.openLink(u):open(u,"_blank");

$("#main").onclick=e=>{const t=e.target;
 if(t.dataset&&t.dataset.showall!==undefined){S.showAll=t.checked;return route()}
 const am=t.closest("[data-assign-m]");if(am){const p=mm(+am.dataset.assignM);if(p)scenesAssignSheet(p);return}
 const tl=t.closest("[data-tile]");if(tl){const k=tl.dataset.tile,pj=S.project||{};
  if(k==="folder"){if(!pj.folder_url)return toast("Пока не доступно");return openLink(pj.folder_url)}
  if(!pj[k+"_file_id"])return toast("Пока не доступно");return go("doc-"+k)}
 const dt=t.closest("[data-doctome]");if(dt){return call("send_doc_to_me",{kind:dt.dataset.doctome}).then(()=>toast("Отправлено вам в личку от бота")).catch(e=>toast(errText(e)))}
 const mb=t.closest("[data-member]");if(mb){const p=mm(+mb.dataset.member);if(p)memberSheet(p);return}
 const sb=t.closest("[data-stage]");if(sb){const mn=$("#main"),y=mn.scrollTop;S.stage=+sb.dataset.stage;S.sel=new Set();updSel();headSig="";paintHead(true);renderChat(false);mn.scrollTop=y;return}
 const g=t.closest("[data-go]");if(g)return go(g.dataset.go);
 const st=t.closest("[data-st]");if(st&&!st.disabled){const h=S.shots.find(x=>x.id===S.curShot);const k=st.dataset.st;return setShot(h,{status:k,...(k==="done"||k==="finished"?{progress:100}:{})})}
 const a=t.closest("[data-act]");if(a){const h=S.shots.find(x=>x.id===S.curShot),k=a.dataset.act;
  if(k==="roles")return rolesSheet();if(k==="stages")return stagesSheet();if(k==="assign")return assignSheet(h);if(k==="topics")return topicsSheet();if(k==="invite")return inviteFlow();
  if(k==="topic"&&h)return openTg("https://t.me/c/"+S.chat+"/"+h.topic_id)}
 const o=t.closest("[data-open]");if(o){const h=S.shots.find(x=>x.id===S.curShot);return openTg("https://t.me/c/"+S.chat+"/"+o.dataset.open+"?thread="+h.topic_id)}
 const tm=t.closest("[data-tome]");if(tm){return call("send_to_me",{id:+tm.dataset.tome}).then(()=>toast("Отправлено вам в личку от бота")).catch(e=>toast(errText(e)))}
 const f=t.closest("[data-fx]");if(f&&has("fix"))return call("toggle_fix",{id:+f.dataset.fx}).then(()=>pollOnce(true)).catch(e=>toast(errText(e)));
 const xf0=t.closest("#hd [data-xf]");if(xf0){fileBlob(xf0.dataset.xf).then(u=>openLb(u)).catch(e=>toast(errText(e)));return}
 const th0=t.closest("#hd .th");if(th0){const id=th0.dataset.th,u=S.thumbs[id],sh=S.shots.find(x=>x.id===id);if(u)openLb(u,sh&&sh.full_id?()=>fileBlob(sh.full_id):null);return}
 const im=t.closest(".msg img");if(im&&im.src){const l=document.createElement("div");l.className="lb";l.innerHTML=`<img src="${im.src}">`;l.onclick=()=>l.remove();document.body.append(l);
  const full=im.dataset.full;if(full&&full!==im.dataset.fid)fileBlob(full).then(u=>{const x=l.querySelector("img");if(x)x.src=u}).catch(()=>{})}};
$("#foot").onclick=e=>{const a=e.target.closest("[data-act]");if(!a)return;
 if(a.dataset.act==="asfile"){S.asFile=!S.asFile;modeLine()}if(a.dataset.act==="dropfile"){S.pendingFile=null;S.asFile=false;modeLine()}};

/* ---------- опрос сервера ---------- */
let pollT=null,polling=false;
let lastAct=Date.now();["click","keydown","touchstart","scroll"].forEach(ev=>addEventListener(ev,()=>lastAct=Date.now(),{passive:true,capture:true}));
const schedule=()=>{clearTimeout(pollT);const idle=Date.now()-lastAct>120000;pollT=setTimeout(()=>pollOnce(),idle?30000:parse()[0]==="shot"?4000:8000)};
async function pollOnce(now){if(!S.me)return;if(polling||(document.hidden&&!now)){if(!now)schedule();return}
 polling=true;
 try{const sid=S.curShot;const r=await call("poll",{since_shots:S.sinceShots,shot_id:sid,since_msgs:S.sinceMsgs});
  if(S.project&&r.project&&r.project.imported_at!==S.project.imported_at){polling=false;await boot(true);schedule();return}
  if(typeof r.unread==="number"&&r.unread!==S.unread){S.unread=r.unread;updBell()}
  let chShots=false,chMem=false,chMsgs=false;
  if(r.project&&S.project&&JSON.stringify(r.project)!==JSON.stringify(S.project)){S.project=r.project;chMem=true}
  if(r.roles&&JSON.stringify(r.roles)!==JSON.stringify(S.roles)){S.roles=r.roles;chMem=true}
  if(r.stages&&JSON.stringify(r.stages)!==JSON.stringify(S.stages)){S.stages=r.stages;fixStage();chMem=true;chMsgs=true}
  if(sid===S.curShot&&r.ss){const mp={};r.ss.forEach(x=>mp[x.stage_id]={status:x.status,progress:x.progress});if(JSON.stringify(mp)!==JSON.stringify(S.ss)){S.ss=mp;chShots=true}}
  if(r.shots.length){const before=JSON.stringify(r.shots.map(x=>S.shots.find(y=>y.id===x.id)));mergeShots(r.shots);chShots=before!==JSON.stringify(r.shots)}
  if(JSON.stringify(r.members)!==JSON.stringify(S.members)){S.members=r.members;chMem=true;const me=mm(S.me.id);if(me){S.me.role=me.role;S.me.perms=me.perms||[]}}
  if(sid===S.curShot&&r.msgs){const n0=S.msgs.length,sig=JSON.stringify(S.msgs);mergeMsgs(r.msgs);chMsgs=chMsgs||sig!==JSON.stringify(S.msgs)||S.msgs.length!==n0||n0===0}
  const busy=document.querySelector(".sheet,.lb");
  if(parse()[0]==="shot"){if((chShots||chMem)&&!document.activeElement.matches?.("#pr"))paintHead(true);if(chMsgs)renderChat()}
  else if((chShots||chMem)&&!busy&&parse()[0]!=="doc")route();
 }catch(e){}
 polling=false;schedule()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pollOnce(true)});

/* ---------- запуск ---------- */
function fatal(html){$("#main").innerHTML=`<div class="empty">${html}</div>`;$("#nav").hidden=true;$("#foot").innerHTML=""}
function loginScreen(){fatal(`Войдите через Telegram<div id="lg" style="margin-top:16px;min-height:44px"></div><div class="sub" style="margin-top:12px">Или откройте приложение кнопкой «Проект» у бота.</div>`);
 window.onTgAuth=async u=>{try{const r=await handle(await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"login",data:u})}));WEB=r.token;try{localStorage.setItem("noem_web",WEB)}catch(e){}boot()}catch(e){toast("Не удалось войти: "+errText(e))}};
 const s=document.createElement("script");s.async=true;s.src="https://telegram.org/js/telegram-widget.js?22";s.dataset.telegramLogin=BOT_NAME;s.dataset.size="large";s.dataset.onauth="onTgAuth(user)";s.dataset.requestAccess="write";$("#lg").append(s)}
async function boot(again){
 if(!again)$("#main").innerHTML=`<div class="empty">Подключение…</div>`;
 if(!INIT&&!WEB)return loginScreen();
 if(API.includes("ВАШ-ПРОЕКТ"))return fatal("В файле index.html не указан адрес API.<br><span class=\"sub\">Замените ВАШ-ПРОЕКТ в строке API.</span>");
 let r;
 try{r=await call("bootstrap",{})}catch(e){
  if(e.code==="not_member")return fatal("Вы не участник группы проекта.<br><span class=\"sub\">Попросите у режиссёра ссылку-приглашение.</span>");
  if(e.code==="unbound")return fatal("Проект ещё не настроен.<br><span class=\"sub\">Режиссёр должен привязать группу командой /bind.</span>");
  if(e.code==="auth"&&!INIT){WEB="";try{localStorage.removeItem("noem_web")}catch(x){}return loginScreen()}if(e.code==="auth")return fatal("Не удалось подтвердить вход через Telegram.<br><span class=\"sub\">Закройте и откройте приложение заново.</span>");
  return fatal("Не удалось подключиться: "+esc(errText(e))+`<br><button class="btn" onclick="boot()">Повторить</button>`)}
 S.me=r.me;S.roles=r.roles||[];S.stages=r.stages||[];S.scenes=r.scenes;S.shots=r.shots;S.members=r.members;S.project=r.project;S.chat=r.chat;S.bound=r.bound;S.sinceShots=maxU(r.shots,0);S.unread=r.unread||0;
 if(!S.bound&&S.me.owner){$("#nav").hidden=false;$("#cfg").hidden=false;
  $("#main").innerHTML=`<div class="wrap"><div class="note"><b>Осталось привязать группу.</b><br>Откройте вашу группу с темами и отправьте в ней команду <b>/bind</b>. Бот ответит, что группа привязана и каких прав ему не хватает. Потом нажмите «Проверить».</div><button class="btn" onclick="boot()">Проверить</button></div>`;return}
 if(!S.me.owner&&!S.me.role&&!document.querySelector(".sheet"))roleSheet();
 route();if(!again)schedule()}
boot();
</script>
