<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noem.line</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--panel:#fbf8f1;--ink:#1d2330;--mute:#7a7f8c;--line:#ded8c8;--acc:#1f4fd8;--accT:#fff;
--s0:#9aa0ac;--s1:#1f4fd8;--s2:#b7791f;--s3:#c8452d;--s4:#2c8a57;--s5:#7c4dbb;--s6:#1b8a94;--s7:#3b4252;--s8:#a3123a;--bubble:#ece6d6;--mine:#dfe8ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1118;--panel:#171b25;--ink:#e8eaf0;--mute:#8b91a0;--line:#262c3a;--acc:#6b8cff;--accT:#0e1118;
--s0:#6d7482;--s1:#6b8cff;--s2:#e0a640;--s3:#f0735a;--s4:#4fc88a;--s5:#b48cf0;--s6:#4fc9d4;--s7:#c9cedb;--s8:#ff5c8a;--bubble:#202635;--mine:#22346b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1118;--panel:#171b25;--ink:#e8eaf0;--mute:#8b91a0;--line:#262c3a;--acc:#6b8cff;--accT:#0e1118;--s0:#6d7482;--s1:#6b8cff;--s2:#e0a640;--s3:#f0735a;--s4:#4fc88a;--s5:#b48cf0;--s6:#4fc9d4;--s7:#c9cedb;--s8:#ff5c8a;--bubble:#202635;--mine:#22346b}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Golos Text",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:default}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font:600 15px "Unbounded",sans-serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex:none}
.btn{background:var(--acc);color:var(--accT);padding:8px 14px;border-radius:10px;font-weight:500}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 13px;font-size:13px;flex:none;white-space:nowrap}
#bell{position:relative}
.bdg{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--s3);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;pointer-events:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;font-weight:500;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;line-height:1.2}
.tile .ic{font-size:22px}.tile.off{opacity:.55}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel)}
nav button{flex:1;padding:12px;color:var(--mute);font-weight:500}
nav button.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.wrap{padding:12px 14px;max-width:720px;margin:0 auto}
.card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center;width:100%;text-align:left}
.num{font:600 13px "Unbounded",sans-serif;min-width:34px;color:var(--mute)}
.th{width:84px;height:52px;border-radius:8px;background:var(--bubble) center/cover;flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c,var(--s1))}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--c);border:1px solid var(--c);border-radius:20px;padding:1px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pct{font:500 12px "Unbounded",sans-serif;color:var(--mute)}
.ava{width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--accT);font-size:11px;font-weight:600;display:grid;place-items:center;margin-left:-6px;border:2px solid var(--panel)}
.avas{display:flex;padding-left:6px}
.h2{font:600 13px "Unbounded",sans-serif;margin:16px 0 8px}
.empty{text-align:center;color:var(--mute);padding:48px 20px}
.empty .btn{margin-top:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:13px}
.seg button.on{border-color:var(--c,var(--acc));color:var(--c,var(--acc));font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc)}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;margin:6px 0;background:var(--bubble);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{margin-left:auto;background:var(--mine)}
.msg .who{font-size:12px;color:var(--mute);margin-bottom:2px;white-space:normal}
.msg img{display:block;max-width:100%;max-height:340px;border-radius:8px;margin:4px 0;cursor:zoom-in;background:var(--line);min-height:60px;min-width:120px}
.file{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:4px 0;white-space:normal}
.file .fn{font-weight:500;overflow-wrap:anywhere}
.msg.sel{outline:2px solid var(--acc);outline-offset:1px}
.msg[data-mid]{-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){.msg[data-mid]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}}
#hd .sub{-webkit-line-clamp:unset;display:block;overflow:visible;overflow-wrap:anywhere;white-space:pre-wrap}
#hd .grow{min-width:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;white-space:normal;margin-top:4px}
.acts button{font-size:12px;border:1px solid var(--line);border-radius:14px;padding:2px 9px;color:var(--acc)}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-right:6px;color:var(--accT);background:var(--s1)}
.tag.fix{background:var(--s3)}.tag.done{background:var(--s4)}
.comp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel);align-items:flex-end}
.comp textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);resize:none;max-height:40vh;overflow-y:auto;line-height:1.35}
#hd .th{cursor:zoom-in}
body.dz::after{content:"Отпустите файл, чтобы прикрепить";position:fixed;inset:8px;border:2px dashed var(--acc);border-radius:16px;background:#0008;color:#fff;display:grid;place-items:center;font-size:16px;z-index:25;pointer-events:none}
.mode{font-size:12px;color:var(--mute);padding:6px 14px 0;background:var(--panel);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode button{color:var(--acc);font-size:12px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--panel);width:100%;max-width:520px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.lb{position:fixed;inset:0;background:#000d;z-index:30;display:grid;place-items:center}.lb img{max-width:96%;max-height:92%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:40;font-size:13px;max-width:90%;text-align:center}
.big{font:600 28px "Unbounded",sans-serif}
.note{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px;white-space:normal}
.link{user-select:all;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
main.pdfmode{display:flex;flex-direction:column;overflow:hidden}
.pdfbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.pdfbar .zl{min-width:58px;height:34px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:500;flex:none}
.pdfv{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;padding:8px;background:var(--line);position:relative}
.pdfv .pg{background:#fff;margin:0 0 8px;position:relative;overflow:hidden;box-shadow:0 1px 4px #0003}
#pages{margin:0 auto}
.cw{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}.cw .card{margin-bottom:0;flex:1;min-width:0;width:auto}
.cw .ib{height:auto;width:42px;color:var(--s3);align-self:stretch}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);margin-top:4px}
textarea.inp{resize:vertical}
#smw *{margin:0;padding:0;box-sizing:border-box}
#smw .topbar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--panel-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:200}
#smw .tl,#smw .tr{flex:1 1 0;display:flex;align-items:center;gap:6px;min-width:0}
#smw .tr{justify-content:flex-end}
#smw .tc{display:flex;justify-content:center}
#smw .tbtn{background:var(--panel-bg3);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;letter-spacing:.5px;transition:all .2s;white-space:nowrap}
#smw .tbtn:hover{background:var(--accent2);color:#fff}
#smw .tbtn.pri,#smw .tbtn.active{background:var(--accent);color:var(--onacc);border-color:var(--accent);font-weight:bold}
#smw .cur{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);letter-spacing:1px}
#smw .cur input{width:42px;text-align:center;background:var(--panel-bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:inherit;font-size:11px;padding:4px 2px;outline:none}
#smw .cur input:focus{border-color:var(--accent)}
#smw .mode-toggle{display:flex;align-items:center;background:var(--panel-bg3);border:1px solid var(--border);border-radius:20px;padding:3px 5px;gap:4px}
#smw .mode-toggle button{border:none;background:transparent;padding:4px 10px;border-radius:14px;color:var(--muted);font-size:11px;letter-spacing:1px;cursor:pointer;font-family:inherit}
#smw .mode-toggle button.active{background:var(--accent);color:var(--onacc);font-weight:bold}
#smw .history-controls{display:flex;align-items:center;gap:4px;padding:3px 5px;background:var(--panel-bg3);border:1px solid var(--border);border-radius:4px}
#smw .history-btn{background:transparent;border:1px solid transparent;color:var(--text);width:26px;height:24px;border-radius:3px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;font-family:inherit}
#smw .history-btn:hover:not(:disabled){background:var(--accent);color:var(--onacc)}
#smw .history-btn:disabled{opacity:.3;cursor:not-allowed}
#smw .history-counter{font-size:10px;color:var(--muted);min-width:40px;text-align:center}
#smw .history-input{width:42px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:inherit;font-size:11px;padding:2px 3px;outline:none;text-align:center}
#smw .history-input:focus{border-color:var(--accent)}
#smw .hdrop{position:fixed;background:var(--dropdown-bg);border:1px solid var(--accent);border-radius:6px;padding:8px;z-index:700;display:none;flex-direction:column;gap:2px;min-width:260px;max-width:340px;max-height:360px;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#smw .hdrop.show{display:flex}
#smw .history-item{padding:6px 10px;border-radius:4px;cursor:pointer;font-size:11px;display:flex;justify-content:space-between;gap:8px;border-left:3px solid transparent}
#smw .history-item:hover{background:var(--sec)}
#smw .history-item.current{background:var(--sec);border-left-color:var(--accent);color:var(--accent);font-weight:bold}
#smw .history-item.future{opacity:.45}
#smw .history-item-time{color:var(--muted);font-size:10px;flex-shrink:0}
#smw .menu{position:relative}
#smw .dd{position:absolute;right:0;top:34px;background:var(--dropdown-bg);border:1px solid var(--accent);border-radius:6px;padding:6px;min-width:240px;display:none;flex-direction:column;gap:2px;box-shadow:0 10px 40px rgba(0,0,0,.35);z-index:300}
#smw .dd.show{display:flex}
#smw .dd button{background:transparent;border:none;border-left:3px solid transparent;color:var(--text);text-align:left;padding:7px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px}
#smw .dd button:hover{background:var(--sec);border-left-color:var(--accent);color:var(--accent)}
#smw .mgr{position:fixed;display:none;width:260px;background:var(--dropdown-bg);border:1px solid var(--accent);border-radius:6px;padding:10px;z-index:700;box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:11px}
#smw .mgr-h{color:var(--accent);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;letter-spacing:1px}
#smw .mgr-h button,#smw .loc-del{background:none;border:none;color:var(--muted);cursor:pointer;display:flex;padding:2px}
#smw .mgr-h button:hover,#smw .loc-del:hover{color:var(--accent2)}
#smw .loc-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
#smw .loc-item{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;border-radius:3px;background:var(--cell-bg);border:1px solid var(--border)}
#smw .loc-add-row{display:flex;gap:4px}
#smw .loc-add-row input{flex:1;background:var(--panel-bg3);border:1px solid var(--border);color:var(--text);font-size:11px;padding:4px 6px;border-radius:3px;font-family:inherit;outline:none}
#smw .loc-add-row input:focus{border-color:var(--accent)}
#smw .loc-add-row button{background:var(--panel-bg3);border:1px solid var(--border);color:var(--text);width:24px;height:24px;border-radius:3px;cursor:pointer;font-size:16px}
#smw .loc-add-row button:hover{background:var(--accent);color:var(--onacc)}
#smw .main{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:auto;padding:8px 12px 24px}
#smw .paper{max-width:1060px;margin:0 auto;background:var(--panel-bg2);border:1px solid var(--border);border-radius:6px;padding:8px 12px 6px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
#smw textarea,#smw input,#smw select{font-family:inherit;color:var(--text);background:transparent;border:1px solid transparent;border-radius:3px;outline:none;transition:border-color .15s,background .15s}
#smw textarea{resize:none;overflow:hidden;display:block;width:100%}
#smw textarea:hover,#smw input:hover,#smw select:hover{background:var(--cell-hover)}
#smw textarea:focus,#smw input:focus,#smw select:focus{border-color:var(--accent);background:var(--cell-bg)}
#smw .h1,#smw .h2{text-align:center;font-family:inherit;font-weight:700;padding:1px 6px;width:100%;display:block;font-size:16px;line-height:1.25}
#smw .h2{color:var(--accent);letter-spacing:3px;margin-bottom:4px}
#smw table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11.5px;min-width:900px}
#smw th{background:var(--panel-bg3);border:1px solid var(--border);padding:0}
#smw th input{width:100%;text-align:center;color:var(--accent);font-size:10.5px;letter-spacing:.5px;font-weight:bold;padding:2px}
#smw td{border:1px solid var(--border);padding:0;vertical-align:middle}
#smw td input,#smw td textarea{width:100%;padding:1px 5px;font-size:11.5px;line-height:1.35}
#smw select{width:100%;padding:1px 2px;font-size:11.5px;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;cursor:pointer}
#smw select option{background:var(--dropdown-bg);color:var(--text)}
#smw td.num{text-align:center;color:var(--muted);font-size:11px;white-space:nowrap}
#smw td.sum{text-align:right;padding:1px 8px;white-space:nowrap}
#smw td.actc{border-left:none;border-top-color:transparent;border-bottom-color:transparent;background:transparent}
#smw .ctl{display:flex;justify-content:center;gap:1px;opacity:.3;transition:opacity .15s}
#smw tr:hover .ctl{opacity:1}
#smw .ib{background:transparent;border:1px solid transparent;color:var(--text);width:16px;height:17px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#smw .ib:hover{background:var(--accent);color:var(--onacc)}
#smw .ib.x:hover{background:#c93c3c;color:#fff}
#smw .ib svg{width:9px;height:9px;display:block}
#smw tr.sec td{background:var(--sec)}
#smw tr.sec td.actc{background:transparent}
#smw tr.sec td.num{color:var(--accent);font-weight:bold;font-family:inherit;font-size:13px}
#smw tr.sec input{font-family:inherit;font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.5px}
#smw tr.tot td{background:var(--panel-bg3)}
#smw tr.tot td.actc,#smw tr.grand td.actc{background:transparent}
#smw tr.tot input{text-align:right;font-weight:bold}
#smw tr.tot td.sum{font-weight:bold;color:var(--accent)}
#smw tr.grand td{background:var(--accent);border-color:var(--accent)}
#smw tr.grand input{text-align:right;font-weight:bold;font-size:12.5px;color:var(--onacc)}
#smw tr.grand td.sum{font-weight:bold;font-size:13px;color:var(--onacc)}
#smw tr.grand input:hover,#smw tr.grand input:focus{background:rgba(255,255,255,.16);color:var(--onacc)}
#smw tr.add td.pn,#smw tr.add td.pl{border:1px dashed var(--border);padding:2px 6px;text-align:left;color:var(--muted);cursor:pointer;font-size:11.5px;background:transparent}
#smw tr.add:hover td.pn,#smw tr.add:hover td.pl{border-color:var(--accent);color:var(--accent);background:var(--sec)}
#smw .lnk{background:transparent;border:1px dashed var(--border);color:var(--muted);cursor:pointer;font-family:inherit;font-size:9.5px;letter-spacing:1px;padding:0 8px;margin:1px 0;border-radius:3px;opacity:.55}
#smw .lnk:hover,#smw tr.add:hover .lnk{border-color:var(--accent);color:var(--accent);opacity:1}
#smw tr.addblock td{border:1px dashed var(--border);text-align:center;padding:3px;color:var(--muted);cursor:pointer;font-size:11.5px;letter-spacing:1px;background:transparent}
#smw tr.addblock:hover td{border-color:var(--accent);color:var(--accent);background:var(--sec)}
#smw .notes{margin-top:4px}
#smw .notes textarea{font-size:10px;color:var(--muted);padding:1px 5px}
#smw.viewer-mode .ed{display:none!important}
#smw.viewer-mode #colAct{width:0!important}
#smw th.actc{background:transparent;border-color:transparent}
#smw.viewer-mode td.actc,#smw.viewer-mode th.actc{border:none;padding:0;width:0}
#smw.viewer-mode .paper input,#smw.viewer-mode .paper textarea,#smw.viewer-mode .paper select{pointer-events:none;background:transparent!important;border-color:transparent!important;cursor:default}
#smw.viewer-mode .notes textarea{color:var(--muted)}
#smw td.nc{position:relative}
#smw td.nc .ni{text-align:right;padding-right:16px;padding-left:16px}
#smw .spin{position:absolute;right:1px;top:1px;bottom:1px;width:14px;display:none;flex-direction:column;gap:1px}
#smw td.nc:hover .spin,#smw td.nc:focus-within .spin{display:flex}
#smw .spin button{flex:1;min-height:0;background:var(--panel-bg3);border:none;border-radius:2px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#smw .spin button:hover{background:var(--accent);color:var(--onacc)}
#smw .spin svg{width:8px;height:8px}

 if(!id){m.innerHTML=`<div class="empty">Пока не доступно</div>`;return}
 m.innerHTML=`<div class="pdfbar"><button class="ib" id="zo" title="Уменьшить">−</button><button class="zl" id="zl" title="По ширине экрана">100%</button><button class="ib" id="zi" title="Увеличить">＋</button><span class="sub grow" id="dp" style="text-align:center;cursor:pointer">Загрузка…</span>${id==="gh"?`<button class="btn ghost sm" data-ghdl="${esc(kind)}">📥 скачать</button>`:`<button class="btn ghost sm" data-doctome="${esc(kind)}">📥 в личку</button>`}</div><div class="pdfv" id="pv"><div id="pages"></div></div>`;
 const say=t=>{const e=$("#dp");if(e)e.textContent=t};
 try{
  if(!window.pdfjsLib)throw new Error("Не загрузился просмотрщик PDF. Откройте файл через «в личку».");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  let buf;if(id==="gh"){const r=await fetch(docUrl(kind),{cache:"no-cache"});if(!r.ok)throw new Error("Файл media/"+DOCF[kind]+".pdf не найден в GitHub: режиссёр ещё не загрузил его или сайт обновляется.");buf=await r.arrayBuffer()}else{const url=await fileBlob(id);buf=await (await fetch(url)).arrayBuffer()}if(tok!==docTok)return;
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf),cMapUrl:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/",cMapPacked:true}).promise;
  const pv=$("#pv"),box=$("#pages"),zl=$("#zl");if(!pv||!box||tok!==docTok)return;
  const N=pdf.numPages,pages=[];let z=pv.clientWidth<560?1.5:1,cur=1,rt=0;
  try{const sv=parseFloat(localStorage.getItem("noem_pz"));if(sv>0)z=sv}catch(e){}
  z=Math.max(.5,Math.min(4,z));
  const fitW=()=>Math.max(160,Math.min(pv.clientWidth-16,900));
  const apply=()=>{box.style.width=Math.round(fitW()*z)+"px";zl.textContent=Math.round(z*100)+"%"};
  const paint=async p=>{p.want=Math.round(fitW()*z);if(p.busy)return;p.busy=true;
   try{while(p.key!==p.want&&p.vis&&tok===docTok){const W=p.want;let k=(W/p.w)*Math.min(window.devicePixelRatio||1,2.5);const px=p.w*k*p.h*k;if(px>16e6)k*=Math.sqrt(16e6/px);
     const vp=p.pg.getViewport({scale:k}),cv=document.createElement("canvas");cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);cv.style.cssText="width:100%;height:100%;display:block";
     await p.pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
     if(!p.vis)break;p.el.replaceChildren(cv);p.key=W}}catch(e){}
   p.busy=false};
  const release=p=>{p.vis=false;p.key=0;p.el.replaceChildren()};
  const repaint=()=>pages.forEach(p=>{if(p.vis)paint(p)});
  const io=new IntersectionObserver(es=>es.forEach(e=>{const p=e.target._p;if(!p)return;if(e.isIntersecting){p.vis=true;paint(p)}else release(p)}),{root:pv,rootMargin:"1500px 0px"});
  const showPg=()=>{const y=pv.scrollTop+pv.clientHeight/3;let n=0;for(let i=0;i<pages.length;i++){if(pages[i].el.offsetTop<=y)n=i;else break}cur=n+1;say(N>1?"стр. "+cur+" из "+N:"1 стр.")};
  const setZ=(nz,fx,fy,soft)=>{nz=Math.max(.5,Math.min(4,nz));if(Math.abs(nz-z)<.001)return;
   if(fx===undefined){fx=pv.clientWidth/2;fy=pv.clientHeight/2}
   const sw=pv.scrollWidth,sh=pv.scrollHeight,rx=(pv.scrollLeft+fx)/sw,ry=(pv.scrollTop+fy)/sh;
   z=nz;apply();pv.scrollLeft=rx*pv.scrollWidth-fx;pv.scrollTop=ry*pv.scrollHeight-fy;
   try{localStorage.setItem("noem_pz",String(z))}catch(e){}
   clearTimeout(rt);rt=setTimeout(repaint,soft?220:100)};
  apply();
  $("#zo").onclick=()=>setZ(z/1.25);$("#zi").onclick=()=>setZ(z*1.25);zl.onclick=()=>setZ(1);
  $("#dp").onclick=async()=>{const v=await askText("Перейти на страницу (1–"+N+")",false,String(cur));if(!v)return;const n=Math.max(1,Math.min(N,parseInt(v,10)||1));if(pages[n-1])pv.scrollTop=pages[n-1].el.offsetTop-8};
  let raf=0;pv.addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;showPg()})},{passive:true});
  const onR=()=>{if(tok!==docTok||!document.body.contains(pv)){removeEventListener("resize",onR);return}apply();clearTimeout(rt);rt=setTimeout(repaint,200)};addEventListener("resize",onR);
  pv.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();const r=pv.getBoundingClientRect();setZ(z*Math.exp(-e.deltaY/200),e.clientX-r.left,e.clientY-r.top,true)},{passive:false});
  let pin=null,lt=0,lx=0,ly=0,sx=0,sy=0,moved=false;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  pv.addEventListener("touchstart",e=>{if(e.touches.length===2){pin={d:dist(e.touches),z};lt=0}else if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false}},{passive:true});
  pv.addEventListener("touchmove",e=>{if(pin&&e.touches.length===2){e.preventDefault();const r=pv.getBoundingClientRect(),a=e.touches[0],b=e.touches[1];setZ(pin.z*dist(e.touches)/pin.d,(a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top,true)}
   else if(e.touches.length===1&&Math.hypot(e.touches[0].clientX-sx,e.touches[0].clientY-sy)>10)moved=true},{passive:false});
  pv.addEventListener("touchend",e=>{if(pin){if(e.touches.length<2)pin=null;moved=true;return}
   if(e.touches.length||moved||e.changedTouches.length!==1)return;const t=e.changedTouches[0],now=Date.now();
   if(now-lt<300&&Math.hypot(t.clientX-lx,t.clientY-ly)<30){const r=pv.getBoundingClientRect();setZ(z<1.5?2:1,t.clientX-r.left,t.clientY-r.top);lt=0}else{lt=now;lx=t.clientX;ly=t.clientY}},{passive:true});
  for(let i=1;i<=N;i++){if(tok!==docTok||!document.body.contains(pv))return;
   const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1}),el=document.createElement("div");el.className="pg";el.style.aspectRatio=vp.width+" / "+vp.height;
   const p={pg,w:vp.width,h:vp.height,el,vis:false,key:0,want:0,busy:false};el._p=p;pages.push(p);box.append(el);io.observe(el);
   if(i%10===0&&i<N)say("Подготовка… "+i+" из "+N)}
  showPg()
 }catch(e){if(tok!==docTok)return;say("");const b=$("#pv");if(b)b.innerHTML=`<div class="note" style="margin:8px">Не удалось открыть PDF в приложении: ${esc(e.code==="too_big"?"файл слишком большой (Telegram не отдаёт файлы больше 20 МБ)":errText(e))}.<br>Нажмите «в личку», чтобы получить файл от бота.</div>`}}

async function pollOnce(now){if(!S.me)return;if(polling||(document.hidden&&!now)){if(!now)schedule();return}

/* ---------- Realtime: «пинг» от сервера → обновиться сейчас ---------- */
let rtCh=null,rtPingT=null,rtLastPoll=0,rtEver=false;
const RT_MIN=3000; // не чаще одного опроса по сигналам раз в 3 с
function rtPing(p){
 if(p&&p.c===CID)return;      // эхо собственного действия: окно и так обновилось
 if(document.hidden)return;   // вернёмся на вкладку: обновимся сами
 if(rtPingT)return;           // опрос уже запланирован, сигналы склеиваются
 const run=()=>{rtPingT=null;if(polling){rtPingT=setTimeout(run,700);return}rtLastPoll=Date.now();pollOnce(true)};
 rtPingT=setTimeout(run,Math.max(0,RT_MIN-(Date.now()-rtLastPoll))+150+Math.random()*1200)} // разброс, чтобы 20 окон не опрашивали сервер одновременно
function rtStart(){
 if(rtCh||!SB_ANON||SB_ANON.includes("ВСТАВЬТЕ"))return;
 const s=document.createElement("script");s.async=true;
 s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
 s.onload=()=>{try{
  const sb=window.supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:false,autoRefreshToken:false}});
  rtCh=sb.channel("noem-sync",{config:{broadcast:{self:false}}})
   .on("broadcast",{event:"ping"},m=>rtPing(m&&m.payload))
   .subscribe(st=>{
    if(st==="SUBSCRIBED"){rtOk=true;schedule();if(rtEver&&Date.now()-rtLastPoll>5000){rtLastPoll=Date.now();pollOnce(true)}rtEver=true} // после переподключения догоняем пропущенное
    else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){if(rtOk){rtOk=false;schedule()}}})
 }catch(e){rtCh=null;rtOk=false}};
 s.onerror=()=>{rtOk=false};
 document.head.append(s)}

const crcTab=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function ZipW(){const P=[],C=[],te=new TextEncoder();let off=0;
 return{async add(name,blob){const nb=te.encode(name),sz=blob.size,crc=crc32(new Uint8Array(await blob.arrayBuffer()));
   if(off+sz+(C.length/2+1)*200>0xFFFFFFFF)throw new Error("Архив больше 4 ГБ: снимите галочки с видео или файлов");
   const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nb.length,true);

/* имя → {s: начало данных, sz, m}. Архивы Noem.line пишутся без «extra» в локальных заголовках, поэтому s = смещение + 30 + длина имени */

 if(e<0)throw new Error("not zip");

  M.set(dec.decode(new Uint8Array(cd.buffer,cd.byteOffset+p+46,nl)),{s:lo+30+nl,sz,m});p+=46+nl+xl+cl}

 {t:'Монтажно-тонировочные работы',rows:[

  ['Цветокоррекция','усл.',1,'смена',1,20000]]}
 ].map(s=>({t:s.t,rows:s.rows.map(r=>({n:r[0],u:r[1],q:String(r[2]),o:r[3],q2:String(r[4]),p:String(r[5])}))}))
});
const DEFW=()=>{const d=DEF();d.LS={u:['чел.','шт.','кадр','сек.','мин.','усл.','комплект','услуга'],o:['аккорд','месяц','смена','час','минута','кадр','метр']};return d};
let D=DEFW(),L=D.L,S=D.S,LS=D.LS,viewer=false;
try{const o=CFG.data;if(o&&o.L&&o.S){L=o.L;S=o.S;LS=o.LS||D.LS}}catch(e){}
const state=()=>JSON.stringify({L,S,LS});
const save=()=>{try{CFG.onChange(state())}catch(e){}};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const rowSum=r=>num(r.q)*num(r.q2)*num(r.p);
const secSum=s=>s.rows.reduce((a,r)=>a+rowSum(r),0);
const grandSum=()=>S.reduce((a,s)=>a+secSum(s),0);
const fmt=n=>n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+L.cur;
const $=id=>document.getElementById(id);
const app=$('app');
const IC={up:'<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5L5 3.2l3 3.3"/></svg>',
 down:'<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5L5 6.8l3-3.3"/></svg>',
 del:'<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l6 6M8 2L2 8"/></svg>',
 foot:'<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><path d="M2.9 4.6c0-1 .9-1.7 2.1-1.7s2.1.7 2.1 1.7c0 1.2-.5 1.7-.5 2.9 0 1-.6 1.6-1.6 1.6s-1.6-.6-1.6-1.6c0-1.2-.5-1.7-.5-2.9z"/><g fill="currentColor" stroke="none"><circle cx="2.6" cy="2.3" r=".75"/><circle cx="4" cy="1.2" r=".6"/><circle cx="5.5" cy="1" r=".55"/><circle cx="6.8" cy="1.4" r=".55"/><circle cx="7.8" cy="2.3" r=".5"/></g></svg>',
 dup:'<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><rect x="3.4" y="3.4" width="5.4" height="5.4" rx=".8"/><path d="M6.6 3.4V2a.8.8 0 0 0-.8-.8H2A.8.8 0 0 0 1.2 2v3.8c0 .44.36.8.8.8h1.4"/></svg>'};

// ---------- история ----------
let H=[{s:state(),l:'Начало',t:Date.now()}],hi=0,maxH=50,pend=null,tm=null;
function commit(l){clearTimeout(tm);pend=null;const s=state();save();if(s===H[hi].s)return;
 H=H.slice(0,hi+1);H.push({s,l,t:Date.now()});while(H.length>maxH+1)H.shift();hi=H.length-1;updHist()}
function later(l){pend=l;clearTimeout(tm);tm=setTimeout(()=>commit(pend),700)}
function flush(){if(pend)commit(pend)}
function jump(i){flush();if(i<0||i>=H.length||i===hi)return;hi=i;const o=JSON.parse(H[i].s);L=o.L;S=o.S;LS=o.LS;render();updHist();save()}
function updHist(){
 $('hcount').textContent=hi+'/'+(H.length-1);$('undoBtn').disabled=hi<=0;$('redoBtn').disabled=hi>=H.length-1;
 if($('smhd').classList.contains('show'))renderHL();
}
function renderHL(){
 $('smhd').innerHTML=H.map((h,i)=>`<div class="history-item${i===hi?' current':i>hi?' future':''}" data-i="${i}"><span>${i}. ${esc(h.l)}</span><span class="history-item-time">${new Date(h.t).toLocaleTimeString('ru-RU')}</span></div>`).reverse().join('');
}
$('undoBtn').onclick=()=>jump(hi-1);$('redoBtn').onclick=()=>jump(hi+1);
$('hmax').onchange=e=>{maxH=Math.max(5,Math.min(500,parseInt(e.target.value)||50));e.target.value=maxH;while(H.length>maxH+1){H.shift()}hi=Math.min(hi,H.length-1);updHist()};
$('histBtn').onclick=e=>{const d=$('smhd'),r=e.currentTarget.getBoundingClientRect();d.style.top=r.bottom+6+'px';d.style.left=Math.max(8,Math.min(r.left-200,innerWidth-350))+'px';d.classList.toggle('show');renderHL()};
$('smhd').addEventListener('click',e=>{e.stopPropagation();const it=e.target.closest('[data-i]');if(it){jump(+it.dataset.i);renderHL()}});
add(document,'keydown',e=>{
 if(viewer||!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();
 if(k==='z'&&!e.shiftKey){e.preventDefault();jump(hi-1)}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();jump(hi+1)}
});

// ---------- рендер ----------
const DS={q:1,q2:1,p:1000};
const stepOf=(r,f)=>{const n=num((r.st&&r.st[f])??'');return n>0?n:DS[f]};
const stepStr=(r,f)=>(r.st&&r.st[f]!=null)?r.st[f]:String(DS[f]);
const numCell=(r,f)=>`<td class="nc"><button class="hl ed" data-hl="1" tabindex="-1" title="Шаг (или Alt + наведение, или правый клик)">${IC.foot}</button><input class="ni" inputmode="decimal" data-f="${f}" value="${esc(r[f])}"><div class="spin ed"><button data-sp="1" data-f="${f}" tabindex="-1" title="Больше">${IC.up}</button><button data-sp="-1" data-f="${f}" tabindex="-1" title="Меньше">${IC.down}</button></div><div class="stp ed"><span>Шаг:</span><input data-st="${f}" value="${esc(stepStr(r,f))}" inputmode="decimal"></div></td>`;
const fmtNum=v=>String(Math.round(v*1e6)/1e6).replace('.',',');
const FN={q:'Кол-во',q2:'Кол-во (2)',p:'Стоимость'};
function bump(si,ri,f,dir){
 const r=S[si].rows[ri];r[f]=fmtNum(Math.max(0,num(r[f])+dir*stepOf(r,f)));
 const inp=app.querySelector(`tr[data-s="${si}"][data-r="${ri}"] input[data-f="${f}"]`);if(inp)inp.value=r[f];
 calc();later(`${FN[f]} ${si+1}.${ri+1}: ${r[f]}`);
}
app.addEventListener('keydown',e=>{
 const t=e.target;if(viewer||t.tagName!=='INPUT'||!['q','q2','p'].includes(t.dataset.f))return;
 if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const tr=t.closest('tr');bump(+tr.dataset.s,+tr.dataset.r,t.dataset.f,e.key==='ArrowUp'?1:-1)}
});
const opts=(list,cur)=>{const l=(cur===''||list.includes(cur))?list:[...list,cur];return `<option value=""${cur===''?' selected':''}></option>`+l.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('')};
function render(){
 const hd=`<th class="actc"></th>`+L.cols.map((c,i)=>`<th><input data-c="${i}" value="${esc(c)}"></th>`).join('');
 let h=`<textarea class="h1" rows="1" data-g="title">${esc(L.title)}</textarea><input class="h2" data-g="project" value="${esc(L.project)}">
 <table><colgroup><col id="colAct" style="width:74px"><col style="width:42px"><col><col style="width:70px"><col style="width:78px"><col style="width:96px"><col style="width:70px"><col style="width:112px"><col style="width:134px"></colgroup>
 <thead><tr>${hd}</tr></thead><tbody>`;
 const ctl=`<td class="actc"><div class="ctl ed"><button class="ib" data-a="up">${IC.up}</button><button class="ib" data-a="down">${IC.down}</button><button class="ib" data-a="dup" title="Дублировать">${IC.dup}</button><button class="ib x" data-a="del" title="Удалить">${IC.del}</button></div></td>`;
 S.forEach((s,si)=>{
  h+=`<tr class="sec" data-s="${si}">${ctl}<td class="num">${si+1}</td><td colspan="7"><input data-sf="t" value="${esc(s.t)}"></td></tr>`;
  s.rows.forEach((r,ri)=>{
   h+=`<tr data-s="${si}" data-r="${ri}">${ctl}<td class="num">${si+1}.${ri+1}</td>
   <td><textarea rows="1" data-f="n">${esc(r.n)}</textarea></td>
   <td><select data-f="u">${opts(LS.u,r.u)}</select></td>
   ${numCell(r,'q')}
   <td><select data-f="o">${opts(LS.o,r.o)}</select></td>
   ${numCell(r,'q2')}
   ${numCell(r,'p')}
   <td class="sum" id="rs-${si}-${ri}"></td></tr>`;
  });
  h+=`<tr class="add ed" data-s="${si}" data-a="addrow"><td class="actc"></td><td class="pn"></td><td class="pl" colspan="7">+ пункт ${si+1}.${s.rows.length+1}</td></tr>
  <tr class="tot"><td class="actc"></td><td colspan="7"><input data-g="total" value="${esc(L.total)}"></td><td class="sum" id="st-${si}"></td></tr>`;
 });
 h+=`<tr class="addblock ed" data-a="addsec"><td colspan="9">+ добавить блок</td></tr>
 <tr class="grand"><td class="actc"></td><td colspan="7"><input data-g="grand" value="${esc(L.grand)}"></td><td class="sum" id="gt"></td></tr></tbody></table>
 <div class="notes"><textarea rows="1" data-g="note1">${esc(L.note1)}</textarea><textarea rows="1" data-g="note2">${esc(L.note2)}</textarea></div>`;
 app.innerHTML=h;
 app.querySelectorAll('textarea').forEach(fit);
 $('cur').value=L.cur;
 applyMode();calc();
}
const fit=t=>{t.style.height='auto';t.style.height=t.scrollHeight+2+'px'};
function calc(){
 S.forEach((s,si)=>{s.rows.forEach((r,ri)=>{const e=$(`rs-${si}-${ri}`);if(e)e.textContent=fmt(rowSum(r))});const e=$('st-'+si);if(e)e.textContent=fmt(secSum(s))});
 const g=$('gt');if(g)g.textContent=fmt(grandSum());
}
function applyMode(){
 app.querySelectorAll('input,textarea').forEach(e=>e.readOnly=viewer);
 app.querySelectorAll('select').forEach(e=>e.disabled=viewer);
 app.querySelectorAll('textarea').forEach(fit);
}
function setMode(v){
 flush();viewer=v;SMW.classList.toggle('viewer-mode',v);
 $('modeEditor').classList.toggle('active',!v);$('modeViewer').classList.toggle('active',v);
 closeMgr();$('smhd').classList.remove('show');applyMode();
}
$('modeEditor').onclick=()=>setMode(false);$('modeViewer').onclick=()=>setMode(true);

// ---------- ввод ----------
const onEdit=e=>{
 if(viewer)return;
 const t=e.target,tr=t.closest('tr');
 if(t.tagName==='TEXTAREA')fit(t);
 if(t.dataset.st){const r=S[+tr.dataset.s].rows[+tr.dataset.r];r.st=r.st||{};r.st[t.dataset.st]=t.value;later('Шаг '+FN[t.dataset.st]+' '+(+tr.dataset.s+1)+'.'+(+tr.dataset.r+1))}
 else if(t.dataset.g){const k=t.dataset.g;L[k]=t.value;app.querySelectorAll(`[data-g="${k}"]`).forEach(x=>{if(x!==t){x.value=t.value;if(x.tagName==='TEXTAREA')fit(x)}});later('Правка подписи')}
 else if(t.dataset.c!==undefined){L.cols[+t.dataset.c]=t.value;later('Правка названия колонки')}
 else if(t.dataset.sf){S[+tr.dataset.s][t.dataset.sf]=t.value;later('Правка названия блока')}
 else if(t.dataset.f){S[+tr.dataset.s].rows[+tr.dataset.r][t.dataset.f]=t.value;calc();if(t.tagName==='SELECT')commit('Выбор: '+(t.value||'—'));else later('Правка пункта '+(+tr.dataset.s+1)+'.'+(+tr.dataset.r+1))}
};
app.addEventListener('input',onEdit);
$('cur').addEventListener('input',e=>{L.cur=e.target.value;calc();later('Смена валюты')});

const newRow=()=>({n:'Новая статья',u:LS.u[0]||'',q:'1',o:LS.o[0]||'',q2:'1',p:'0'});
function addSec(){flush();S.push({t:'Новый блок',rows:[newRow()]});commit('Добавлен блок '+S.length);render();
 const el=app.querySelector(`tr.sec[data-s="${S.length-1}"] input`);el.focus();el.select()}

// ---------- менеджер списков (ЕД. ИЗМ / ЗАНЯТОСТЬ) ----------
let mgr=null;
function closeMgr(){mgr=null;$('mgr').style.display='none'}
function openMgr(k,btn){
 if(mgr===k){closeMgr();return}
 mgr=k;const m=$('mgr'),r=btn.getBoundingClientRect();
 m.style.left=Math.max(8,Math.min(r.left,innerWidth-276))+'px';m.style.top=r.bottom+6+'px';m.style.display='block';
 $('mgrTitle').textContent=k==='u'?'ЕДИНИЦЫ ИЗМЕРЕНИЯ':'ЗАНЯТОСТЬ';$('mgrInp').value='';renderMgr();$('mgrInp').focus();
}
function renderMgr(){
 $('mgrList').innerHTML=LS[mgr].map((v,i)=>`<div class="loc-item"><span>${esc(v)}</span><button class="loc-del" data-i="${i}" title="Убрать">${IC.del.replace('<svg','<svg width="11" height="11"')}</button></div>`).join('')||'<div class="loc-item" style="color:var(--muted)">Список пуст</div>';
}
function syncNote(k,v,add){
 const key=k==='u'?'note1':'note2';let t=L[key]||'';
 const m=t.match(/^([^:]*:\s*)([\s\S]*?)(,?\s*и т\.д\.?[\s\S]*)$/);
 if(m){let it=m[2].split(',').map(x=>x.trim()).filter(Boolean);const lv=v.toLowerCase();
  if(add){if(!it.some(x=>x.toLowerCase()===lv))it.push(v)}else it=it.filter(x=>x.toLowerCase()!==lv);
  t=m[1]+it.join(', ')+(it.length?', ':'')+m[3].replace(/^,?\s*/,'')}
 else if(add)t+=(t?', ':'')+v;
 L[key]=t;
}
function mgrAdd(){
 const v=$('mgrInp').value.trim();if(!v||LS[mgr].includes(v))return;
 flush();LS[mgr].push(v);syncNote(mgr,v,true);commit((mgr==='u'?'Ед. изм: +':'Занятость: +')+v);$('mgrInp').value='';renderMgr();render();
}
$('mgr').addEventListener('click',e=>{
 e.stopPropagation();
 const d=e.target.closest('.loc-del');
 if(d){flush();const v=LS[mgr].splice(+d.dataset.i,1)[0];syncNote(mgr,v,false);commit((mgr==='u'?'Ед. изм: −':'Занятость: −')+v);renderMgr();render()}
 else if(e.target.closest('#mgrAdd'))mgrAdd();
 else if(e.target.closest('#mgrClose'))closeMgr();
});
$('mgrInp').addEventListener('keydown',e=>{if(e.key==='Enter')mgrAdd();else if(e.key==='Escape')closeMgr()});
$('unitBtn').onclick=e=>{e.stopPropagation();openMgr('u',e.currentTarget)};
$('occBtn').onclick=e=>{e.stopPropagation();openMgr('o',e.currentTarget)};

// ---------- клики: блоки/пункты ----------
const closeSteps=()=>app.querySelectorAll('td.nc.open').forEach(x=>x.classList.remove('open'));
app.addEventListener('mouseover',e=>{if(viewer||!e.altKey)return;const td=e.target.closest('td.nc');if(td)td.classList.add('open')});
app.addEventListener('contextmenu',e=>{const td=e.target.closest('td.nc');if(!td||viewer)return;e.preventDefault();closeSteps();td.classList.add('open')});
app.addEventListener('mouseout',e=>{const td=e.target.closest('td.nc');if(td&&!td.contains(e.relatedTarget)&&!td.matches(':focus-within'))td.classList.remove('open')});
app.addEventListener('focusout',e=>{const td=e.target.closest('td.nc');if(td)setTimeout(()=>{if(!td.matches(':hover')&&!td.matches(':focus-within'))td.classList.remove('open')},60)});
add(document,'keydown',e=>{
 if(e.key==='Escape')closeSteps();
 if(e.key==='Alt'&&!viewer){const td=app.querySelector('td.nc:hover');if(td){e.preventDefault();td.classList.add('open')}}
});
add(document,'keyup',e=>{if(e.key==='Alt')e.preventDefault()});
add(document,'click',e=>{
 const t=e.target;
 if(!t.closest('#xm,#xbtn'))$('xm').classList.remove('show');
 if(!t.closest('#hd,#histBtn'))$('smhd').classList.remove('show');
 if(mgr&&!t.closest('#mgr'))closeMgr();
 const hl=t.closest('#app [data-hl]');
 if(hl&&!viewer){const td=hl.closest('td'),was=td.classList.contains('open');closeSteps();if(!was)td.classList.add('open');return}
 if(!t.closest('.stp'))closeSteps();
 const sp=t.closest('#app [data-sp]');
 if(sp&&!viewer){const tr=sp.closest('tr');bump(+tr.dataset.s,+tr.dataset.r,sp.dataset.f,+sp.dataset.sp);return}
 const b=t.closest('#app [data-a]');if(!b||viewer)return;
 const a=b.dataset.a,tr=b.closest('tr'),s=tr?+tr.dataset.s:0,isRow=tr&&tr.dataset.r!==undefined,r=isRow?+tr.dataset.r:-1;
 if(a==='addsec'){addSec();return}
 flush();
 if(a==='addrow'){S[s].rows.push(newRow());commit('Добавлен пункт '+(s+1)+'.'+S[s].rows.length);render();const el=app.querySelector(`tr[data-s="${s}"][data-r="${S[s].rows.length-1}"] textarea`);el.focus();el.select();return}
 const arr=isRow?S[s].rows:S,i=isRow?r:s,what=isRow?`пункт ${s+1}.${r+1}`:`блок ${s+1}`;
 if(a==='dup'){const cp=JSON.parse(JSON.stringify(arr[i]));arr.splice(i+1,0,cp);commit('Продублирован '+what)}
 else if(a==='del'){
  if(!isRow&&S[s].rows.length&&!confirm('Удалить весь блок вместе с пунктами?'))return;
  arr.splice(i,1);commit('Удалён '+what);
 }else{const j=a==='up'?i-1:i+1;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];commit('Перемещён '+what)}
 render();
});
$('xbtn').onclick=()=>$('xm').classList.toggle('show');

// ---------- ZIP (без сжатия) ----------
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files,mime){
 const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
 for(const f of files){
  const nm=enc.encode(f.name),d=enc.encode(f.data),crc=crc32(d);
  const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
  parts.push(lh,nm,d);
  cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
  off+=lh.length+nm.length+d.length;
 }
 let cds=0;cd.forEach(x=>cds+=x.length);
 const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cds),...u32(off),0,0]);
 return new Blob([...parts,...cd,end],{type:mime});
}

 imgs.forEach((im,i)=>{
  const pg=4+i*3,ct=pg+1,ig=pg+2,cont=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  obj(pg,`<</Type/Page/Parent 2 0 R/MediaBox [0 0 ${PW} ${PH}]/Resources<</XObject<</Im0 ${ig} 0 R>>>>/Contents ${ct} 0 R>>`);
  obj(ct,`<</Length ${cont.length}>>`,cont);
  obj(ig,`<</Type/XObject/Subtype/Image/Width ${iw}/Height ${ih}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${im.length}>>`,im);
 });

 for(let i=1;i<=N;i++)x+=`${String(offs[i]).padStart(10,'0')} 00000 n \n`;

const FILE_EXT='smetaana';
let saveHandle=null;
const idb=()=>new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('noem_smeta',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbPut=async(k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const idbGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const idbDel=async k=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const canPick=()=>typeof window.showSaveFilePicker==='function'&&window.isSecureContext;
function setHandle(h){saveHandle=h||null;if(h)idbPut('h',h).catch(()=>{});else idbDel('h').catch(()=>{})}

async function writeTo(h,json){const w=await h.createWritable();try{await w.write(json);await w.close()}catch(e){try{await w.abort()}catch(_){}throw e}}
async function okPerm(h){const o={mode:'readwrite'};if((await h.queryPermission(o))==='granted')return true;return(await h.requestPermission(o))==='granted'}
const pickTypes=[{description:'Проект noem/smeta.ana',accept:{'application/json':['.'+FILE_EXT]}}];

let toastTm=null;
function notifySaved(anchorId){
 let el=$('saveToast');if(!el){el=document.createElement('div');el.id='saveToast';SMW.appendChild(el)}
 el.textContent='✓ Проект сохранён';el.classList.remove('show');el.style.left='0px';el.style.top='0px';void el.offsetWidth;
 const w=el.offsetWidth,a=$(anchorId||'saveBtn');let x=(innerWidth-w)/2,y=60;
 if(a){const r=a.getBoundingClientRect();x=r.left+r.width/2-w/2;y=r.bottom+8}
 el.style.left=Math.round(Math.max(8,Math.min(x,innerWidth-w-8)))+'px';el.style.top=Math.round(y)+'px';
 el.classList.add('show');clearTimeout(toastTm);toastTm=setTimeout(()=>el.classList.remove('show'),2200);
}
async function saveProject(forceNew){
 flush();const json=projectJson(),btn=forceNew?'saveAsBtn':'saveBtn';
 if(!canPick()){download(new Blob([json],{type:'application/octet-stream'}),fname(FILE_EXT));notifySaved(btn);return}
 try{
  if(!forceNew&&saveHandle){
   let ok=false;
   try{ok=await okPerm(saveHandle)}catch(_){ok=false}
   if(ok){try{await writeTo(saveHandle,json)}catch(_){ok=false}}
   if(ok){notifySaved(btn);return}
   // файл удалён / нет доступа — спросим заново
  }
  const h=await window.showSaveFilePicker({suggestedName:fname(FILE_EXT),types:pickTypes});
  await writeTo(h,json);setHandle(h);notifySaved(btn);
 }catch(err){
  if(err&&err.name==='AbortError')return;
  console.warn('Save failed, fallback to download:',err);
  download(new Blob([json],{type:'application/octet-stream'}),fname(FILE_EXT));notifySaved(btn);
 }
}
$('saveBtn').onclick=()=>saveProject(false);
$('saveAsBtn').onclick=()=>saveProject(true);
add(document,'keydown',e=>{

function kppExport(){const d=sheet(`<div class="h2" style="margin-top:0">Экспорт КПП</div>${[["docx","Word (.docx)"],["pdf","PDF"],["xlsx","Excel (.xlsx)"],["noemkpp","Файл .noemkpp (json)"]].map(([k,n])=>`<button class="card" data-e="${k}" style="width:100%;text-align:left"><span class="grow"><div class="t">${n}</div></span></button>`).join("")}`);

 i.onchange=async()=>{const f=i.files[0];if(!f)return;let o;try{o=JSON.parse(await f.text())}catch(e){return toast("Не удалось прочитать файл")}

 const trs=kList(K).map(x=>x.b?`<w:tr><w:trPr><w:cantSplit/></w:trPr>${cell(x.b.n,9638,{span:4,f:x.b.c.slice(1),w:1,h:1,z:24})}</w:tr>`:row(x.r,0)).join("");
 const body=para(K.title,{b:1,c:1,z:32,a:80})+(K.film?para(K.film,{c:1,z:26,a:200}):"")+`<w:tbl><w:tblPr><w:tblW w:w="9638" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${W.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${row(KH,1)}${trs}</w:tbl>${para("")}`;
 return kZip([["[Content_Types].xml",XH+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
  ["_rels/.rels",XH+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
  ["word/document.xml",XH+`<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`]],"application/vnd.openxmlformats-officedocument.wordprocessingml.document")}
async function kppXlsx(K){const cols="ABCD",W=[42,34,16,32],c=(r,i,t,s)=>`<c r="${cols[i]}${r}" t="inlineStr" s="${s}"><is><t xml:space="preserve">${xe(t)}</t></is></c>`;
 let rows=`<row r="1" ht="24" customHeight="1">${c(1,0,K.title,1)}</row><row r="2">${c(2,0,K.film,1)}</row><row r="4">${KH.map((h,i)=>c(4,i,h,2)).join("")}</row>`,n=5,mg=['<mergeCell ref="A1:D1"/>','<mergeCell ref="A2:D2"/>'];
 kList(K).forEach(x=>{if(x.b){rows+=`<row r="${n}" ht="20" customHeight="1">${c(n,0,x.b.n,4+x.bi)}${[1,2,3].map(i=>c(n,i,"",4+x.bi)).join("")}</row>`;mg.push(`<mergeCell ref="A${n}:D${n}"/>`)}else rows+=`<row r="${n}">${x.r.map((t,i)=>c(n,i,t,3)).join("")}</row>`;n++});
 const sh=XH+`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${W.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${rows}</sheetData><mergeCells count="${mg.length}">${mg.join("")}</mergeCells></worksheet>`;
 const fills=K.blocks.map(b=>`<fill><patternFill patternType="solid"><fgColor rgb="FF${b.c.slice(1).toUpperCase()}"/><bgColor indexed="64"/></patternFill></fill>`).join("");
 const bx=K.blocks.map((b,i)=>`<xf numFmtId="0" fontId="3" fillId="${3+i}" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>`).join("");
 const st=XH+`<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font><font><b/><sz val="12"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="7"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE7E6E6"/><bgColor indexed="64"/></patternFill></fill>${fills}</fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color auto="1"/></left><right style="thin"><color auto="1"/></right><top style="thin"><color auto="1"/></top><bottom style="thin"><color auto="1"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>${bx}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
 return kZip([["[Content_Types].xml",XH+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],

  ["xl/workbook.xml",XH+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="КПП" sheetId="1" r:id="rId1"/></sheets></workbook>'],
  ["xl/_rels/workbook.xml.rels",XH+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
  ["xl/worksheets/sheet1.xml",sh],["xl/styles.xml",st]],"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")}
async function kppPdf(K){const PW=1240,PH=1754,M=90,ff="sans-serif",cw=[.34,.30,.14,.22].map(x=>x*(PW-2*M)),pages=[];let cv,cx,y;
 const np=()=>{cv=document.createElement("canvas");cv.width=PW;cv.height=PH;cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,PW,PH);cx.fillStyle="#000";cx.textBaseline="top";cx.textAlign="left";pages.push(cv);y=M};
 const wrap=(t,w)=>{const out=[];String(t||"").split("\n").forEach(par=>{let line="";par.split(/\s+/).forEach(wd=>{const s=line?line+" "+wd:wd;if(cx.measureText(s).width>w-16&&line){out.push(line);line=wd}else line=s});out.push(line)});return out};
 const draw=(a,h)=>{cx.font=(h?"bold ":"")+"24px "+ff;const Lh=a.map((t,i)=>wrap(t,cw[i])),rh=Math.max(...Lh.map(l=>l.length))*32+16;
  if(y+rh>PH-M&&y>M){np();draw(KH,1);cx.font=(h?"bold ":"")+"24px "+ff}
  if(h){cx.fillStyle="#e7e6e6";cx.fillRect(M,y,PW-2*M,rh)}
  let x=M;cx.fillStyle="#000";cx.strokeStyle="#000";cx.lineWidth=1.5;
  Lh.forEach((l,i)=>{cx.strokeRect(x,y,cw[i],rh);l.forEach((s,j)=>cx.fillText(s,x+8,y+8+j*32));x+=cw[i]});y+=rh};
 const band=b=>{if(y+160>PH-M&&y>M){np();draw(KH,1)}cx.fillStyle=b.c;cx.fillRect(M,y,PW-2*M,48);cx.fillStyle="#fff";cx.font="bold 28px "+ff;cx.fillText(b.n,M+12,y+10);cx.strokeStyle="#000";cx.lineWidth=1.5;cx.strokeRect(M,y,PW-2*M,48);cx.fillStyle="#000";y+=48};
 np();cx.textAlign="center";cx.font="bold 40px "+ff;wrap(K.title,PW-2*M).forEach(s=>{cx.fillText(s,PW/2,y);y+=50});
 if(K.film){cx.font="32px "+ff;wrap(K.film,PW-2*M).forEach(s=>{cx.fillText(s,PW/2,y);y+=42})}
 cx.textAlign="left";y+=30;draw(KH,1);kList(K).forEach(x=>x.b?band(x.b):draw(x.r,0));
 const imgs=[];for(const c of pages)imgs.push(new Uint8Array(await new Promise(r=>c.toBlob(b=>b.arrayBuffer().then(r),"image/jpeg",.92))));
 const enc=new TextEncoder(),ch=[],offs=[];let pos=0;const put=d=>{const b=typeof d==="string"?enc.encode(d):d;ch.push(b);pos+=b.length};

 const n=imgs.length,N=3+3*n,pw=595,ph=842;put("%PDF-1.4\n");obj(1,"<</Type/Catalog/Pages 2 0 R>>");obj(2,`<</Type/Pages/Count ${n}/Kids [${imgs.map((_,i)=>`${4+i*3} 0 R`).join(" ")}]>>`);
 obj(3,`<</Title <FEFF${[...K.title].map(c=>c.charCodeAt(0).toString(16).padStart(4,"0")).join("")}>/Producer (Noem.line)>>`);
 imgs.forEach((im,i)=>{const pg=4+i*3,cn=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;obj(pg,`<</Type/Page/Parent 2 0 R/MediaBox [0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 ${pg+2} 0 R>>>>/Contents ${pg+1} 0 R>>`);obj(pg+1,`<</Length ${cn.length}>>`,cn);
  obj(pg+2,`<</Type/XObject/Subtype/Image/Width ${PW}/Height ${PH}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${im.length}>>`,im)});

 put(x+`trailer\n<</Size ${N+1}/Root 1 0 R/Info 3 0 R>>\nstartxref\n${xr}\n%%EOF`);return new Blob(ch,{type:"application/pdf"})}
