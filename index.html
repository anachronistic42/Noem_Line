<script>

const API = "https://admbsxycsucognmoxmng.supabase.co/functions/v1/noem";
/* Realtime: вставьте сюда публичный ключ anon (Supabase → Project Settings → API → anon public).
   Пока ключ не вставлен, приложение работает как раньше, на обычном опросе (polling). */
const SB_URL = "https://admbsxycsucognmoxmng.supabase.co";
const SB_ANON = "sb_publishable_O51RLwLUd0ED0_8376MeMg_oHJC1dbD";
/* ===================================================== */
const CID = Math.random().toString(36).slice(2, 10); // метка этого окна: чтобы не реагировать на эхо собственных действий

const TGW = window.Telegram && Telegram.WebApp;

if (TGW) { try { TGW.ready(); TGW.expand(); if (TGW.colorScheme) document.documentElement.dataset.theme = TGW.colorScheme; } catch (e) {} }

const ST = [["todo","Не начат","--s0"],["work","В работе","--s1"],["review","На проверке","--s2"],["fix","Правки","--s3"],["done","Принят","--s4"],["ship","Отгрузить","--s5"],["shipped","Отгружен","--s6"],["finished","Завершён","--s7"],["error","Ошибка","--s8"]];

const $ = s => document.querySelector(s);

const S = { stages:[], ss:{}, stage:null, roles:[], showAll:false, me:null, scenes:[], shots:[], members:[], project:null, chat:null, bound:false, thumbs:{}, msgs:[],
  unread:0, sinceShots:0, sinceMsgs:0, curShot:null, pendingFile:null, asFile:false, fixMode:false, busy:false };
S.manage=false;try{S.manage=localStorage.getItem("noem_manage")==="1"}catch(e){}
const stOf = k => ST.find(s => s[0] === k) || ST[0];
const fmtSize = n => !n ? "" : n < 1048576 ? Math.round(n/1024) + " КБ" : (n/1048576).toFixed(n < 10485760 ? 1 : 0) + " МБ";
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}

/* ---------- сеть ---------- */
async function call(action, data){
  if(S.off)return offCall(action,data||{});
  const r = await fetch(API, {method:"POST", headers:{"content-type":"application/json",...AH()}, body:JSON.stringify({action, cid:CID, ...data})});

async function handle(r){
  if(!r.ok){let e={};try{e=await r.json()}catch(x){}if(e.error==="deleted")fatal(`Ваш аккаунт удалён из Noem.line.<br><span class="sub">Обратитесь к режиссёру.</span>`);const er=new Error(e.error||("HTTP "+r.status));er.code=e.error;er.status=r.status;throw er}
  return r.json();
}
const ERR = {pdf_big:"PDF больше 20 МБ: Telegram не даёт приложению скачивать такие файлы", not_pdf:"Нужен файл в формате PDF", bad_url:"Ссылка должна начинаться с http:// или https://", too_big:"Файл больше 50 МБ. Отправьте его прямо в топик в Telegram.", forbidden:"Нет прав на это действие", start_bot:"Сначала нажмите Start в чате с ботом", empty:"Пустое сообщение", anim_big:"Видео больше 50 МБ: отправьте его в общий чат группы с подписью #аниматик", not_video:"Нужен видеофайл (.mp4)"};

Object.assign(ERR,{bad_invite:"Ссылка недействительна или уже использована",login_taken:"Такой логин уже занят",bad_login:"Логин: 3–32 символа, латиница, цифры, _ . -",bad_password:"Пароль должен быть от 6 символов",bad_creds:"Неверный логин или пароль",locked:"Слишком много попыток. Подождите 10 минут",no_assignees:"Сначала назначьте исполнителя на кадр",already_linked:"Этот аккаунт уже привязан",bad_cover:"Не удалось сохранить обложку"});
const blobCache = new Map();
function fileBlob(id){
  if(S.off){const u=offUrl(S.off.files[id]);return u?Promise.resolve(u):Promise.reject(Object.assign(new Error("Файла нет в бэкапе"),{code:"nofile"}))}
  if(!blobCache.has(id)){
    blobCache.set(id, fetch(API,{method:"POST",headers:{"content-type":"application/json",...AH()},body:JSON.stringify({action:"file",file_id:id})})
      .then(async r=>{if(!r.ok){const e=await r.json().catch(()=>({}));const er=new Error(e.error||"HTTP "+r.status);er.code=e.error;throw er}return URL.createObjectURL(await r.blob())})
      .catch(e=>{blobCache.delete(id);throw e}));
  }
  return blobCache.get(id);

/* ---------- данные ---------- */
const shotsOf = id => vis().filter(h => h.scene === id);
const mm = id => S.members.find(m => m.tg_id === id);

const SND="snd",isSnd=h=>!!h&&h.scene===SND,realScenes=()=>S.scenes.filter(s=>s.id!==SND);

const seeAll=()=>!!S.off||S.me.owner||manage()||(!noUn()&&(S.me.role==="Продюсер"||S.showAll));

const canEdit=h=>S.me.owner||mine(h)||has("status");
const fixStage=()=>{if(isSnd(S.shots.find(x=>x.id===S.curShot))){S.stage=null;return}if(!S.stages.some(s=>s.id===S.stage))S.stage=S.stages[0]?S.stages[0].id:null};

const msgStage=x=>S.stages.some(s=>s.id===x.stage_id)?x.stage_id:(S.stages[0]?S.stages[0].id:null);
const showToggle=()=>S.me.owner||S.me.role==="Продюсер"||manage()||noUn()||S.off?"":`<label class="note" style="display:block"><input type="checkbox" data-showall ${S.showAll?"checked":""}> Показать задачи, на которые вы не назначены</label>`;

/* ---------- опрос сервера ---------- */
let pollT=null,polling=false;
let lastAct=Date.now();["click","keydown","touchstart","scroll"].forEach(ev=>addEventListener(ev,()=>lastAct=Date.now(),{passive:true,capture:true}));
let rtOk=false;
/* Realtime жив: опрос редкий, только как страховка. Realtime не работает: обычный опрос */
const schedule=()=>{clearTimeout(pollT);const idle=Date.now()-lastAct>120000;
 const ms=rtOk?(idle?180000:90000):(idle?30000:parse()[0]==="shot"?4000:8000);
 pollT=setTimeout(()=>pollOnce(),ms)};
async function pollOnce(now){if(!S.me)return;if(polling||(document.hidden&&!now)){if(!now)schedule();return}
 polling=true;
 try{const sid=S.curShot;const r=await call("poll",{since_shots:S.sinceShots,shot_id:sid,since_msgs:S.sinceMsgs});
  if(S.project&&r.project&&(r.project.imported_at!==S.project.imported_at||(r.project.struct_at||0)!==(S.project.struct_at||0))){polling=false;await boot(true);schedule();return}
  if(typeof r.unread==="number"&&r.unread!==S.unread){S.unread=r.unread;updBell()}
  let chShots=false,chMem=false,chMsgs=false;
  if(r.project&&S.project&&JSON.stringify(r.project)!==JSON.stringify(S.project)){S.project=r.project;chMem=true}
  if(r.roles&&JSON.stringify(r.roles)!==JSON.stringify(S.roles)){S.roles=r.roles;chMem=true}
  if(r.stages&&JSON.stringify(r.stages)!==JSON.stringify(S.stages)){S.stages=r.stages;fixStage();chMem=true;chMsgs=true}
  if(sid===S.curShot&&r.ss){const mp={};r.ss.forEach(x=>mp[x.stage_id]={status:x.status,progress:x.progress});if(JSON.stringify(mp)!==JSON.stringify(S.ss)){S.ss=mp;chShots=true}}
  if(r.shots.length){const before=JSON.stringify(r.shots.map(x=>S.shots.find(y=>y.id===x.id)));mergeShots(r.shots);chShots=before!==JSON.stringify(r.shots)}
  if(JSON.stringify(r.members)!==JSON.stringify(S.members)){S.members=r.members;chMem=true;const me=mm(S.me.id);if(me){S.me.role=me.role;S.me.perms=me.perms||[]}}
  if(sid===S.curShot&&r.msgs){const n0=S.msgs.length,sig=JSON.stringify(S.msgs);mergeMsgs(r.msgs);chMsgs=chMsgs||sig!==JSON.stringify(S.msgs)||S.msgs.length!==n0||n0===0}
  const busy=document.querySelector(".sheet,.lb");
  if(parse()[0]==="shot"){if((chShots||chMem)&&!document.activeElement.matches?.("#pr"))paintHead(true);if(chMsgs)renderChat()}
  else if((chShots||chMem)&&!busy&&!["doc","anim"].includes(parse()[0]))route();
 }catch(e){}
 polling=false;schedule()}

/* ---------- Realtime: «пинг» от сервера → обновиться сейчас ---------- */
let rtCh=null,rtPingT=null,rtLastPoll=0,rtEver=false;
const RT_MIN=3000; // не чаще одного опроса по сигналам раз в 3 с
function rtPing(p){
 if(p&&p.c===CID)return;      // эхо собственного действия: окно и так обновилось
 if(document.hidden)return;   // вернёмся на вкладку: обновимся сами
 if(rtPingT)return;           // опрос уже запланирован, сигналы склеиваются
 const run=()=>{rtPingT=null;if(polling){rtPingT=setTimeout(run,700);return}rtLastPoll=Date.now();pollOnce(true)};
 rtPingT=setTimeout(run,Math.max(0,RT_MIN-(Date.now()-rtLastPoll))+150+Math.random()*1200)} // разброс, чтобы 20 окон не опрашивали сервер одновременно
function rtStart(){
 if(rtCh||!SB_ANON||SB_ANON.includes("ВСТАВЬТЕ"))return;
 const s=document.createElement("script");s.async=true;
 s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
 s.onload=()=>{try{
  const sb=window.supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:false,autoRefreshToken:false}});
  rtCh=sb.channel("noem-sync",{config:{broadcast:{self:false}}})
   .on("broadcast",{event:"ping"},m=>rtPing(m&&m.payload))
   .subscribe(st=>{
    if(st==="SUBSCRIBED"){rtOk=true;schedule();if(rtEver&&Date.now()-rtLastPoll>5000){rtLastPoll=Date.now();pollOnce(true)}rtEver=true} // после переподключения догоняем пропущенное
    else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){if(rtOk){rtOk=false;schedule()}}})
 }catch(e){rtCh=null;rtOk=false}};
 s.onerror=()=>{rtOk=false};
 document.head.append(s)}

  $("#main").innerHTML=`<div class="wrap"><div class="note"><b>Осталось привязать группу.</b><br>Откройте вашу группу с темами и отправьте в ней команду <b>/bind</b>. Бот ответит, что группа привязана и каких прав ему не хватает. Потом нажмите «Проверить».</div><button class="btn" onclick="boot()">Проверить</button></div>`;return}

/* ===================== БЭКАП: экспорт, загрузка, офлайн ===================== */
const canBk=()=>!!S.me&&!S.off&&(S.me.owner||has("export")),canDel=()=>!!S.me&&!S.off&&(S.me.owner||has("del_users"));
const BK_OPTS=[["chat","Чаты (тексты сообщений)"],["db","База данных (сцены, кадры, статусы, исполнители, должности, права)"],["docs","Лит. и реж. сценарии, библия персонажей (PDF)"],["sb","Изначальная раскадровка из .noemocean"],["img","Картинки из чатов"],["vid","Видео из чатов"],["oth","Другие файлы из чатов"]];
const catOf=x=>x.file_id?(["photo","image"].includes(x.file_kind)?"img":x.file_kind==="video"?"vid":"oth"):null;
const safeN=s=>String(s==null?"":s).replace(/[\\\/:*?"<>|\x00-\x1f]/g,"_").trim().slice(0,80)||"_";
const mimeOf=p=>({jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",mp4:"video/mp4",webm:"video/webm",mov:"video/quicktime",pdf:"application/pdf",mp3:"audio/mpeg",ogg:"audio/ogg",oga:"audio/ogg"})[String(p).split(".").pop().toLowerCase()]||"application/octet-stream";
/* --- zip: запись (без сжатия) и чтение --- */
const crcTab=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcTab[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function ZipW(){const P=[],C=[],te=new TextEncoder();let off=0;
 return{async add(name,blob){const nb=te.encode(name),sz=blob.size,crc=crc32(new Uint8Array(await blob.arrayBuffer()));
   if(off+sz+(C.length/2+1)*200>0xFFFFFFFF)throw new Error("Архив больше 4 ГБ: снимите галочки с видео или файлов");
   const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nb.length,true);
   const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
   P.push(h.buffer,nb,blob);C.push(c.buffer,nb);off+=30+nb.length+sz},
  finish(){let cs=0;for(let i=0;i<C.length;i+=2)cs+=46+C[i+1].length;const n=C.length/2,e=new DataView(new ArrayBuffer(22));
   e.setUint32(0,0x06054b50,true);e.setUint16(8,n,true);e.setUint16(10,n,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);

/* имя → {s: начало данных, sz, m}. Архивы Noem.line пишутся без «extra» в локальных заголовках, поэтому s = смещение + 30 + длина имени */
async function zipIndex(f){const sl=(a,b)=>f.slice(a,b).arrayBuffer(),size=f.size,tl=Math.min(size,65557),tail=new DataView(await sl(size-tl,size));let e=-1;
 for(let i=tail.byteLength-22;i>=0;i--)if(tail.getUint32(i,true)===0x06054b50){e=i;break}
 if(e<0)throw new Error("not zip");
 const cnt=tail.getUint16(e+10,true),cs=tail.getUint32(e+12,true),co=tail.getUint32(e+16,true),cd=new DataView(await sl(co,co+cs)),dec=new TextDecoder(),M=new Map();let p=0;
 for(let k=0;k<cnt&&p+46<=cd.byteLength;k++){if(cd.getUint32(p,true)!==0x02014b50)break;
  const m=cd.getUint16(p+10,true),sz=cd.getUint32(p+20,true),nl=cd.getUint16(p+28,true),xl=cd.getUint16(p+30,true),cl=cd.getUint16(p+32,true),lo=cd.getUint32(p+42,true);
  M.set(dec.decode(new Uint8Array(cd.buffer,cd.byteOffset+p+46,nl)),{s:lo+30+nl,sz,m});p+=46+nl+xl+cl}

const zBlob=(f,idx,path)=>{const e=idx&&idx.get(path);return e&&e.m===0?new Blob([f.slice(e.s,e.s+e.sz)],{type:mimeOf(path)}):null};
const toDataUrl=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});
/* --- окно с галочками --- */
function bkAsk(title,keys,okTxt){return new Promise(res=>{const d=sheet(`<div class="h2" style="margin-top:0">${esc(title)}</div>${BK_OPTS.filter(o=>keys.includes(o[0])).map(o=>`<label class="card" style="cursor:pointer"><input type="checkbox" value="${o[0]}" checked><span class="grow">${esc(o[1])}</span></label>`).join("")}<div class="sub" style="-webkit-line-clamp:unset;margin:4px 2px">Картинки, видео и файлы из чатов зависят от пункта «Чаты».</div><div class="row" style="margin-top:12px"><button class="btn" id="y">${okTxt}</button><button class="btn ghost" id="n">Отмена</button></div>`);
 const chk=()=>{const c=d.querySelector("[value=chat]");d.querySelectorAll("[value=img],[value=vid],[value=oth]").forEach(i=>{i.disabled=c?!c.checked:false})};d.addEventListener("change",chk);chk();
 d.querySelector("#y").onclick=()=>{const o={};d.querySelectorAll("input").forEach(i=>o[i.value]=i.checked&&!i.disabled);d.remove();res(o)};
 d.querySelector("#n").onclick=()=>{d.remove();res(null)}})}
const progSheet=t=>{const d=sheet(`<div class="h2" style="margin-top:0">${t}</div><p class="sub" id="bkp" style="-webkit-line-clamp:unset">Подготовка…</p>`);return[d,s=>{const e=d.querySelector("#bkp");if(e)e.textContent=s}]};
/* --- экспорт --- */
async function bkExport(){
 const o=await bkAsk("Экспорт бэкапа проекта",BK_OPTS.map(x=>x[0]),"Скачать");if(!o||!Object.values(o).some(Boolean))return;
 const[prog,say]=progSheet("Экспорт бэкапа");
 try{
  const Z=ZipW(),M={format:"noemline-backup",v:1,created:Date.now(),opts:o},files={},gh={},thumbs={},docs={},skipped=[],tasks=[];
  const core=await call("export_data",{part:"core"});
  M.title=(core.project&&core.project.title)||"";
  if(o.db)Object.assign(M,{project:core.project,scenes:core.scenes,shots:core.shots,shot_stages:core.shot_stages,stages:core.stages,roles:core.roles,members:core.members});
  const scn=Object.fromEntries(core.scenes.map(s=>[s.id,s])),used=new Set(),fold={};
  for(const h of core.shots){let n=h.scene===SND?"Звук "+safeN(h.num):"Сц "+safeN((scn[h.scene]||{}).num||"?")+" · Кадр "+safeN(h.num),b=n,i=2;while(used.has(n))n=b+" ("+i++ +")";used.add(n);fold[h.id]="media/"+n}
  let msgs=[];
  if(o.chat){let after=0;for(;;){say("Чаты: "+msgs.length);const r=await call("export_data",{part:"msgs",after});msgs=msgs.concat(r.rows);if(r.rows.length<1000)break;after=r.rows[r.rows.length-1].id}M.messages=msgs}
  const tgGet=async id=>{const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json",...AH()},body:JSON.stringify({action:"file",file_id:id})});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||"HTTP "+r.status)}return r.blob()};
  const webGet=async u=>{const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return r.blob()};
  for(const x of msgs){const c=catOf(x);if(!c||!o[c])continue;const p=(fold[x.shot_id]||"media/_без кадра")+"/chat/"+(c==="img"?"images":c==="vid"?"videos":"files")+"/"+x.id+"_"+safeN(x.file_name);
   files[x.file_id]=p;if(c==="img"&&x.thumb_id)files[x.thumb_id]=p;tasks.push({p,get:()=>tgGet(x.file_id)})}
  if(o.sb){for(const h of core.shots){const f=fold[h.id];
    (h.img_files||[]).forEach(n=>{if(!n)return;const p=f+"/storyboard/"+safeN(n);gh[n]=p;tasks.push({p,get:()=>webGet(mediaUrl(n))})});
    if(h.full_id){const p=f+"/storyboard/telegram_1.jpg";files[h.full_id]=p;tasks.push({p,get:()=>tgGet(h.full_id)})}
    (h.full_extra||[]).forEach((e,i)=>{if(e&&e.id){const p=f+"/storyboard/telegram_"+(i+2)+".jpg";files[e.id]=p;tasks.push({p,get:()=>tgGet(e.id)})}})}
   let after="";for(;;){say("Раскадровка: обложки");const r=await call("export_data",{part:"thumbs",after});for(const t of r.rows){if(!fold[t.shot_id])continue;const p=fold[t.shot_id]+"/storyboard/cover.jpg";thumbs[t.shot_id]=p;await Z.add(p,await (await fetch(t.data)).blob())}
    if(r.rows.length<15)break;after=r.rows[r.rows.length-1].shot_id}}
  if(o.docs&&core.project){const pj=core.project,g=pj.doc_mode==="github";
   for(const k of["lit","dir","chars"]){const id=pj[k+"_file_id"];
    if(g){const p="media/_docs/"+DOCF[k]+".pdf";docs[k]=p;tasks.push({p,get:()=>webGet(docUrl(k))})}
    else if(id){const p="media/_docs/"+safeN(pj[k+"_name"]||DOCF[k]+".pdf");docs[k]=p;files[id]=p;tasks.push({p,get:()=>tgGet(id)})}}}
  let n=0,i=0;const worker=async()=>{while(i<tasks.length){const t=tasks[i++];try{await Z.add(t.p,await t.get())}catch(e){skipped.push({path:t.p,err:String(e.message||e)});for(const k in files)if(files[k]===t.p)delete files[k];for(const k in gh)if(gh[k]===t.p)delete gh[k];for(const k in docs)if(docs[k]===t.p)delete docs[k]}
    say("Файлы: "+(++n)+" из "+tasks.length+(skipped.length?" (пропущено: "+skipped.length+")":""))}};
  await Promise.all([worker(),worker(),worker()]);
  Object.assign(M,{files,gh,thumbs,docs,skipped});
  await Z.add("project.noemline",new Blob([JSON.stringify(M)],{type:"application/json"}));
  const url=URL.createObjectURL(Z.finish()),a=document.createElement("a");a.href=url;a.download="Noem.line_backup_"+new Date().toISOString().slice(0,10)+".zip";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  prog.remove();toast(skipped.length?"Готово. Пропущено файлов: "+skipped.length+" (больше 20 МБ или недоступны)":"Бэкап скачан")
 }catch(e){prog.remove();toast("Экспорт не удался: "+errText(e))}}
/* --- загрузка бэкапа в проект --- */
async function backupLoad(f,d){
 const av=BK_OPTS.map(x=>x[0]).filter(k=>d.opts&&d.opts[k]);if(!av.length)return toast("В бэкапе нет данных");
 const o=await bkAsk("Что загрузить из бэкапа?",av,"Загрузить");if(!o||!Object.values(o).some(Boolean))return;
 if(!await askYes("Данные проекта будут обновлены из бэкапа: совпадающие записи заменятся. Продолжить?"))return;
 const[prog,say]=progSheet("Загрузка бэкапа");
 try{
  let idx=null;const hd=new Uint8Array(await f.slice(0,4).arrayBuffer());if(hd[0]===0x50&&hd[1]===0x4b)idx=await zipIndex(f);
  const send=(table,rows,x)=>call("restore",{table,rows,...x});
  const chunks=async(table,rows,n,x)=>{for(let i=0;i<rows.length;i+=n){say(table+": "+Math.min(i+n,rows.length)+" из "+rows.length);await send(table,rows.slice(i,i+n),x)}};
  if(o.db){await chunks("roles",d.roles||[],200);await chunks("stages",d.stages||[],200);await chunks("scenes",d.scenes||[],200);
   await chunks("shots",d.shots||[],150,{sb:!!o.sb});await chunks("shot_stages",d.shot_stages||[],400);await chunks("members",d.members||[],100);
   if(d.project)await send("project",[],{data:{title:d.project.title}})}
  else if(o.sb)await chunks("shots_sb",d.shots||[],100);
  if(o.docs&&d.project)await send("project",[],{data:d.project});
  if(o.sb&&idx){const e=Object.entries(d.thumbs||{});for(let i=0;i<e.length;i+=6){say("обложки: "+Math.min(i+6,e.length)+" из "+e.length);const rows=[];
    for(const[sid,p]of e.slice(i,i+6)){const b=zBlob(f,idx,p);if(b)rows.push({shot_id:sid,data:await toDataUrl(b)})}await send("thumbs",rows)}}
  if(o.chat){const ms=(d.messages||[]).map(x=>{const c=catOf(x);if(c&&!o[c]){const y={...x};["file_id","thumb_id","file_kind","file_name","file_size"].forEach(k=>y[k]=null);return y}return x});await chunks("messages",ms,300)}
  await send("end",[],{last:true});
  prog.remove();toast("Бэкап загружен");await boot(true)
 }catch(e){prog.remove();toast("Загрузка не удалась: "+errText(e))}}
/* --- офлайн --- */
const OFFU=new Map();
function offUrl(p){if(!S.off||!p)return"";let u=OFFU.get(p);if(u)return u;const b=zBlob(S.off.f,S.off.idx,p);if(!b)return"";u=URL.createObjectURL(b);OFFU.set(p,u);return u}
async function offCall(a,d){const O=S.off;
 if(a==="poll"){const ms=d.shot_id?O.msgs.filter(x=>x.shot_id===d.shot_id).sort((x,y)=>x.id-y.id):null;
  return{shots:[],members:S.members,project:S.project,msgs:ms?(+d.since_msgs?[]:ms.slice(-300)):null,roles:S.roles,stages:S.stages,ss:d.shot_id?O.ss.filter(x=>x.shot_id===d.shot_id):null,unread:0}}
 if(a==="thumbs")return Object.fromEntries((d.ids||[]).map(i=>[i,O.th[i]?offUrl(O.th[i]):""]).filter(x=>x[1]));
 if(a==="notifs")return{items:[],unread:0};
 if(a==="notif_read")return{ok:true,unread:0};
 const er=new Error("Офлайн: изменения никуда не отправляются");er.code="offline";throw er}
async function offLoad(f){
 try{let d,idx=new Map();const hd=new Uint8Array(await f.slice(0,4).arrayBuffer());
  if(hd[0]===0x50&&hd[1]===0x4b){const z=await readZipEntry(f,n=>/\.noemline$/i.test(n)&&!/(^|\/)(__MACOSX|\._)/.test(n));if(!z)return toast("В архиве нет файла .noemline");d=JSON.parse(new TextDecoder().decode(z.buf).replace(/^\uFEFF/,""));idx=await zipIndex(f)}
  else d=JSON.parse(await f.text());
  if(!d||d.format!=="noemline-backup"||!d.project||!d.shots)return toast("Нужен бэкап Noem.line, сделанный вместе с базой данных");
  OFFU.forEach(u=>URL.revokeObjectURL(u));OFFU.clear();
  S.off={f,idx,created:d.created,files:d.files||{},gh:d.gh||{},th:d.thumbs||{},docs:d.docs||{},msgs:d.messages||[],ss:d.shot_stages||[]};
  Object.assign(S,{me:{id:0,name:"Офлайн",role:null,owner:false,perms:[],web_only:true,login:null},roles:d.roles||[],stages:d.stages||[],scenes:d.scenes||[],shots:d.shots||[],members:(d.members||[]).filter(x=>!x.deleted),project:d.project,chat:null,bound:false,unread:0,thumbs:{}});
  $("#nav").hidden=false;$("#cfg").hidden=false;route();toast("Офлайн-режим: бэкап от "+new Date(d.created).toLocaleDateString())
 }catch(e){S.off=null;toast("Не удалось прочитать архив")}}
function offPick(){const i=document.createElement("input");i.type="file";i.accept=".noemline,.zip,application/zip,application/json";i.onchange=()=>{if(i.files[0])offLoad(i.files[0])};i.click()}

async function loadDel(){if(!$("#dl"))return;try{const r=await call("del_list",{}),el=$("#dl");if(!el)return;
 el.innerHTML=r.items.length?r.items.map(p=>`<div class="card"><span class="grow"><div class="t">${esc(p.name)}${p.tg_id<0?' <span class="sub">· noem.line</span>':""}</div><div class="sub">${p.restore_pending?"ждёт возвращения в группу · ":""}${p.deleted_at?new Date(p.deleted_at).toLocaleDateString():""}</div></span><button class="btn sm" data-res-m="${p.tg_id}">${p.restore_pending?"Ссылка":"Вернуть"}</button></div>`).join(""):`<div class="sub">Никого нет</div>`}catch(x){}}

 try{const r=await call("del_member",{id});S.members=S.members.filter(x=>x.tg_id!==id);toast(r.kick_failed?"Удалён, но из группы исключить не удалось: бот должен быть админом с правом блокировки":"Пользователь удалён");route()}catch(e){toast(errText(e))}}
async function resMember(id){try{const r=await call("restore_member",{id});
 if(r.link){const d=sheet(`<div class="h2" style="margin-top:0">Ссылка-приглашение</div><p class="sub" style="-webkit-line-clamp:unset">Одноразовая. Пользователь восстановится в Noem.line, когда вернётся в группу Telegram по этой ссылке.</p><div class="link">${esc(r.link)}</div><div class="row"><button class="btn" id="cp">Скопировать</button><button class="btn ghost" id="shr">Отправить в Telegram</button></div>`);
  d.querySelector("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(r.link);toast("Скопировано")}catch(e){toast("Выделите ссылку и скопируйте вручную")}};
  d.querySelector("#shr").onclick=()=>{const u="https://t.me/share/url?url="+encodeURIComponent(r.link);TGW&&TGW.openTelegramLink?TGW.openTelegramLink(u):open(u)}}

boot();
